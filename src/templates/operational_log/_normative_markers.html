{% load static %}
{% for marker in markers %}
<span class="draft-normative-marker opj-normative-marker is-{{ marker.kind }}"
      tabindex="0"
      data-opj-marker
      data-marker-kind="{{ marker.kind }}"
      data-marker-number="{{ marker.pz_number }}"
      data-marker-count="{{ marker.count|default:1 }}"
      data-marker-label="{{ marker.label|default:'Нормативная отметка' }}"
      aria-label="{{ marker.label|default:'Нормативная отметка' }}{% if marker.pz_number %}, №{{ marker.pz_number }}{% endif %}">
    <span class="draft-normative-marker-top">
        {% if marker.kind == 'pz_install' or marker.kind == 'pz_remove' %}ПЗ{% else %}ЗН{% endif %}
    </span>
    <span class="draft-normative-marker-bolt" aria-hidden="true">ϟ</span>
    {% if marker.pz_number %}<span class="draft-normative-marker-bottom">№{{ marker.pz_number }}</span>{% endif %}
    <i class="draft-normative-marker-cross" aria-hidden="true"></i>
</span>
{% empty %}
<span class="opj-empty-marker" aria-hidden="true">&nbsp;</span>
{% endfor %}
<script data-opj-marker-runtime data-repair-css-url="{% static 'operational_log/opj_lifecycle_acceptance_repair.css' %}?v=opjlifecycle00605">
(() => {
    "use strict";
    const runtimeScript = document.currentScript;
    if (window.__EOD_OPJ_MARKER_RUNTIME_00605__) return;
    window.__EOD_OPJ_MARKER_RUNTIME_00605__ = true;

    let floatingPopover = null;
    let refreshQueued = false;

    function ensureRepairStylesheet() {
        const target = runtimeScript?.dataset.repairCssUrl || "";
        if (!target) return;
        let link = document.querySelector(
            'link[href*="opj_lifecycle_acceptance_repair.css"]',
        );
        if (!link) {
            link = document.createElement("link");
            link.rel = "stylesheet";
            document.head.append(link);
        }
        if (link.getAttribute("href") !== target) {
            link.href = target;
        }
    }

    function normalizedMarkerCount(marker) {
        const value = Number.parseInt(marker.dataset.markerCount || "1", 10);
        return Number.isFinite(value) && value > 0 ? Math.min(value, 100) : 1;
    }

    function expandGroupedMarkers(root = document) {
        root.querySelectorAll(
            "[data-opj-marker][data-marker-count]:not([data-marker-expanded])",
        ).forEach((marker) => {
            const count = normalizedMarkerCount(marker);
            marker.dataset.markerExpanded = "true";
            marker.dataset.markerInstance = "0";
            marker.dataset.markerCount = "1";
            let anchor = marker;
            for (let index = 1; index < count; index += 1) {
                const clone = marker.cloneNode(true);
                clone.dataset.markerExpanded = "true";
                clone.dataset.markerInstance = String(index);
                clone.dataset.markerCount = "1";
                clone.classList.remove("is-cleared");
                anchor.after(clone);
                anchor = clone;
            }
        });
    }

    function rowsInChronology() {
        const selectors = [
            "[data-row-store] [data-draft-card]",
            ".approved-journal-table tbody tr",
            ".approved-journal-print-table tbody tr",
        ];
        const rows = [];
        selectors.forEach((selector) => {
            document.querySelectorAll(selector).forEach((row) => {
                if (!rows.includes(row)) rows.push(row);
            });
        });
        return rows;
    }

    function markerKey(marker) {
        const kind = marker.dataset.markerKind || "";
        const number = (marker.dataset.markerNumber || "").trim();
        if (kind.startsWith("pz_")) return number ? `pz:${number}` : "";
        if (kind.startsWith("zn_")) return `zn:${number || "common"}`;
        return "";
    }

    function applyChronology() {
        expandGroupedMarkers();
        const installed = new Map();
        rowsInChronology().forEach((row) => {
            row.querySelectorAll("[data-opj-marker]").forEach((marker) => {
                marker.classList.remove("is-cleared");
                const kind = marker.dataset.markerKind || "";
                const key = markerKey(marker);
                if (!key) return;
                if (kind === "pz_install" || kind === "zn_on") {
                    const list = installed.get(key) || [];
                    list.push(marker);
                    installed.set(key, list);
                    return;
                }
                if (kind === "pz_remove" || kind === "zn_off") {
                    const list = installed.get(key) || [];
                    const source = [...list].reverse().find(
                        (candidate) => !candidate.classList.contains("is-cleared"),
                    );
                    if (source) source.classList.add("is-cleared");
                }
            });
        });
    }

    function queueRefresh() {
        if (refreshQueued) return;
        refreshQueued = true;
        queueMicrotask(() => {
            refreshQueued = false;
            applyChronology();
        });
    }

    function closePopover() {
        floatingPopover?.remove();
        floatingPopover = null;
    }

    function normalizedText(node) {
        return (node.textContent || "").replace(/\s+/g, " ").trim();
    }

    function exactUnderlinedFragments(marker) {
        const row = marker.closest("tr, [data-draft-card]");
        if (!row) return [];
        const kind = marker.dataset.markerKind || "";
        const selector = kind === "pz_remove" || kind === "zn_off"
            ? ".opj-rich-segment.is-normative-close"
            : ".opj-rich-segment.is-normative-open";
        let values = Array.from(row.querySelectorAll(selector))
            .map(normalizedText)
            .filter(Boolean);

        const number = (marker.dataset.markerNumber || "").replace(/^№\s*/, "").trim();
        if (number) {
            const matching = values.filter((value) => (
                value.includes(`№${number}`)
                || value.includes(`№ ${number}`)
                || value.includes(number)
            ));
            if (matching.length) values = matching;
        }
        values = values.filter((value, index) => values.indexOf(value) === index);
        const instance = Number.parseInt(marker.dataset.markerInstance || "0", 10);
        if (Number.isFinite(instance) && values[instance]) {
            return [values[instance]];
        }
        return values;
    }

    function placePopover(trigger, popover) {
        const margin = 12;
        const triggerRect = trigger.getBoundingClientRect();
        popover.style.visibility = "hidden";
        document.body.append(popover);
        const box = popover.getBoundingClientRect();
        let left = triggerRect.left + triggerRect.width / 2 - box.width / 2;
        left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));
        let top = triggerRect.top - box.height - 8;
        if (top < margin) top = triggerRect.bottom + 8;
        top = Math.max(margin, Math.min(top, window.innerHeight - box.height - margin));
        popover.style.left = `${Math.round(left)}px`;
        popover.style.top = `${Math.round(top)}px`;
        popover.style.visibility = "";
    }

    function openPopover(trigger) {
        closePopover();
        const popover = document.createElement("aside");
        popover.className = "opj-marker-popover is-floating";
        popover.setAttribute("role", "tooltip");

        const heading = document.createElement("strong");
        heading.textContent = trigger.dataset.markerLabel || "Нормативная отметка";
        popover.append(heading);

        const values = exactUnderlinedFragments(trigger);
        if (values.length) {
            const list = document.createElement("ul");
            list.className = "opj-marker-source-list";
            values.forEach((value) => {
                const item = document.createElement("li");
                item.textContent = value;
                list.append(item);
            });
            popover.append(list);
        }

        floatingPopover = popover;
        placePopover(trigger, popover);
    }

    document.addEventListener("mouseover", (event) => {
        const marker = event.target.closest?.("[data-opj-marker]");
        if (!marker || marker.contains(event.relatedTarget)) return;
        openPopover(marker);
    });

    document.addEventListener("mouseout", (event) => {
        const marker = event.target.closest?.("[data-opj-marker]");
        if (!marker || marker.contains(event.relatedTarget)) return;
        closePopover();
    });

    document.addEventListener("focusin", (event) => {
        const marker = event.target.closest?.("[data-opj-marker]");
        if (marker) openPopover(marker);
    });

    document.addEventListener("focusout", (event) => {
        const marker = event.target.closest?.("[data-opj-marker]");
        if (marker && !marker.contains(event.relatedTarget)) closePopover();
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closePopover();
    });
    window.addEventListener("resize", closePopover);
    document.addEventListener("scroll", closePopover, true);

    const observer = new MutationObserver(queueRefresh);
    observer.observe(document.documentElement, {childList: true, subtree: true});

    ensureRepairStylesheet();
    applyChronology();
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyChronology, {once: true});
    }
})();
</script>
