name: eod-development

services:
  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - eod_development_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    image: ${EOD_RELEASE_IMAGE:?EOD_RELEASE_IMAGE is required}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /opt/eod-host/app-entrypoint.sh
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8766
      - --workers
      - "2"
      - --threads
      - "4"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - eod_config.wsgi:application
    environment:
      EOD_DEPLOYMENT_MODE: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,5.181.177.72}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://5.181.177.72}
      DJANGO_TRUST_PROXY_HTTPS: ${DJANGO_TRUST_PROXY_HTTPS:-1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
      EOD_PUBLIC_HTTPS: ${EOD_PUBLIC_HTTPS:-1}
      EOD_PUBLIC_HTTPS_ORIGIN: ${EOD_PUBLIC_HTTPS_ORIGIN:-https://5.181.177.72}
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: development
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
    ports:
      - 127.0.0.1:${EOD_DEVELOPMENT_PORT:-8766}:8766
    volumes:
      - /etc/eod-automation/app-entrypoint.sh:/opt/eod-host/app-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8766/_health/', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - frontend
      - backend

volumes:
  eod_development_postgres_data:

networks:
  frontend:
  backend:
    internal: true
