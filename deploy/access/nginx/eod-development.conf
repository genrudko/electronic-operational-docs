# ACCESS-001 managed public development HTTPS virtual host.
limit_req_zone $binary_remote_addr zone=eod_access001_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 5.181.177.72;

    access_log /var/log/nginx/eod-development-access.log;
    error_log /var/log/nginx/eod-development-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/eod-access001/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://5.181.177.72$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5.181.177.72;

    ssl_certificate /etc/letsencrypt/live/5.181.177.72/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.181.177.72/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EODAccess001TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 16m;
    keepalive_timeout 65s;

    access_log /var/log/nginx/eod-development-access.log;
    error_log /var/log/nginx/eod-development-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/eod-access001/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /_health {
        return 404;
    }

    location = /accounts/login/ {
        limit_req zone=eod_access001_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }
}
