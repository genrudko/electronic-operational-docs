[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "electronic-operational-docs"
version = "0.1.0"
description = "Модульная система электронной оперативной документации"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
    "coverage>=7.9,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [
    ".venv",
    "backups",
    "data",
    "logs",
    "media",
    "staticfiles",
    "src/**/migrations/*.py",
]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = []

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
