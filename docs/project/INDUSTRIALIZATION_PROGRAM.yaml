schema_version: eod.industrialization-program.v1
program_id: PROJECT-SUSTAINABILITY-001
version: 1.0-candidate-repair2
date: 2026-08-05
status: PROPOSAL
canonical_owner: docs/project/INDUSTRIALIZATION_PROGRAM.yaml
human_view: docs/project/INDUSTRIALIZATION_PROGRAM.md
risk_register: docs/audits/PROJECT_SUSTAINABILITY_RISK_REGISTER_20260805.csv
baseline_audit: docs/audits/PROJECT_SUSTAINABILITY_BASELINE_20260805.md
principles:
  - id: modular-monolith
    classification: DECISION
    statement: Preserve the modular Django monolith; no microservices without proven necessity.
  - id: no-big-bang
    classification: DECISION
    statement: Industrialize through bounded work items; do not rewrite the product wholesale.
  - id: one-product
    classification: DECISION
    statement: One deployable product and application version with scoped optional modules.
  - id: history-preservation
    classification: DECISION
    statement: Module deactivation never deletes historical data.
  - id: github-canonical
    classification: DECISION
    statement: GitHub remains the only canonical source; Drive is a material library.
  - id: risk-traceability
    classification: PROPOSAL
    statement: Every industrialization work item must close named risk IDs and provide acceptance evidence.
gates:
  - id: SAFE-CONTINUATION
    classification: PROPOSAL
    purpose: Minimum prerequisites before an owner may authorize limited work in an existing accepted domain contour.
    required_work_items:
      - PROJECT-STATE-RECONCILIATION-001
      - INDUSTRIALIZATION-PROGRAM-EXECUTION-001
      - MODULE-ACTIVATION-CONTRACT-001
      - SECRET-HYGIENE-001
      - DEPENDENCY-PROVENANCE-001
      - DEPLOYMENT-PROFILE-001
      - BACKUP-RESTORE-DRILL-001
      - SECURITY-BASELINE-001
    acceptance:
      - Canonical planning views agree and automated checks prevent drift.
      - Module activation semantics are accepted before implementation.
      - No reusable credentials are exposed by CI or documentation.
      - Dependency and image inputs are reproducible and attributable.
      - Pilot/production configuration contract fails closed.
      - A representative backup has been restored, verified and certified.
      - Risk register and industrial backlog have owners and acceptance.
    post_gate_policy:
      limited_existing_contour_work:
        allowed_only_by: explicit_product_owner_decision
        example: SHIFT-HANDOVER-001
      mass_new_journals_and_modules:
        allowed_after:
          - MODULE-REGISTRY-001
          - UX-PLATFORM-FOUNDATION-001
          - PAGE-TEMPLATE-LIBRARY-001
          - MODULE-SOURCE-GOVERNANCE-001
      exception:
        requires:
          - separate_ADR
          - explicit_product_owner_decision
          - bounded_scope_and_accepted_risks
  - id: PILOT-READY
    classification: PROPOSAL
    purpose: Mandatory evidence gate before real pilot users, operational data or a pilot facility.
    required_core_work_items:
      - PROJECT-STATE-RECONCILIATION-001
      - INDUSTRIALIZATION-PROGRAM-EXECUTION-001
      - MODULE-ACTIVATION-CONTRACT-001
      - SECRET-HYGIENE-001
      - DEPENDENCY-PROVENANCE-001
      - DEPLOYMENT-PROFILE-001
      - BACKUP-RESTORE-DRILL-001
      - SECURITY-BASELINE-001
      - MODULE-REGISTRY-001
      - DATA-INTEGRITY-HARDENING-001
      - MIGRATION-SAFETY-001
      - MODULE-MIGRATION-COMPATIBILITY-001
      - DATA-GOVERNANCE-001
      - RELEASE-ROLLBACK-001
      - OBSERVABILITY-001
      - INCIDENT-RESPONSE-001
      - AUTH-RBAC-HARDENING-001
      - SECURITY-PIPELINE-001
      - UX-BROWSER-GATES-001
      - SUPPORT-HANDOVER-001
      - PILOT-READINESS-001
    critical_risk_policy:
      applicable: close_or_explicitly_accept_with_bounded_controls_owner_due_date_and_review_condition
      not_applicable: document_scope_evidence_and_owner_approval
    scope_dependent_work_items:
      - id: UPLOAD-HARDENING-001
        trigger: Pilot enables any upload, import or file-download surface.
      - id: DATA-PORTABILITY-001
        trigger: Pilot contract, exit plan, disaster migration or regulatory response requires portable export.
      - id: LEGACY-UX-MIGRATION-001
        trigger: Pilot includes routes with unresolved legacy/overlay risk.
      - id: UX-PLATFORM-FOUNDATION-001
        trigger: Pilot introduces a new page family, journal or module UI, or another explicitly recorded pilot trigger requires the shared UX foundation.
      - id: PAGE-TEMPLATE-LIBRARY-001
        trigger: Pilot introduces a new page family, journal or module UI, or another explicitly recorded pilot trigger requires reusable page templates.
      - id: MODULE-SOURCE-GOVERNANCE-001
        trigger: Pilot introduces a new module/capability or requires source freshness beyond accepted evidence.
      - id: DRIVE-LIBRARY-GOVERNANCE-001
        trigger: Google Drive materials are used in pilot operation or acceptance.
      - id: PERFORMANCE-BASELINE-001
        trigger: Pilot workload exceeds a bounded single-site small-cohort profile or PSR-031 is not explicitly accepted.
    browser_gate_policy:
      route_scope: actual_critical_pilot_routes
      screen_scope:
        - existing_accepted_screens
        - migrated_screens
      requires_general_ux_refactor: false
      ux_foundation_and_page_templates_required_when:
        - new_page_family
        - new_journal
        - new_module_ui
        - other_explicitly_recorded_pilot_trigger
    residual_risk_policy:
      high_medium: close_or_record_owner_controls_due_date_review_condition_and_explicit_owner_acceptance
      long_term_not_applicable: does_not_block_without_pilot_specific_justification
    acceptance:
      - Mandatory core work items are accepted.
      - Every applicable CRITICAL risk is closed or explicitly accepted with bounded controls.
      - Pilot-scope-dependent work is completed or formally shown not applicable.
      - Residual HIGH and MEDIUM risks follow the residual-risk policy.
      - Scoped module activation and history preservation are demonstrated.
      - Recovery, rollback, observability, incident response and security controls are exercised.
      - Actual critical pilot routes on existing accepted and migrated screens pass supported browser, viewport, theme and print gates without requiring a general UX refactor.
      - Another specialist completes install, restore, upgrade and diagnosis from repository documentation.
      - Product owner explicitly approves the pilot scope, residual risks and known limitations.
phases:
  - id: 0
    name: Governance and canonical-state integrity
    objective: Restore a reliable source of truth before platform implementation.
    work_items:
      - id: PROJECT-STATE-RECONCILIATION-001
        priority: P0
        type: DOCUMENTATION_AUTOMATION
        risks: [PSR-001, PSR-002, PSR-034]
        dependencies: []
        acceptance:
          - One canonical status owner and consistent derived views.
          - Documentation checker rejects stale accepted/module/work-item state.
      - id: INDUSTRIALIZATION-PROGRAM-EXECUTION-001
        priority: P0
        type: GOVERNANCE
        risks: [PSR-034]
        dependencies: [PROJECT-STATE-RECONCILIATION-001]
        acceptance:
          - Industrial backlog, gates and risks are represented in canonical planning.
  - id: 1
    name: SAFE-CONTINUATION architecture and runtime baseline
    objective: Accept module semantics and close the highest recovery, configuration and security risks.
    work_items:
      - id: MODULE-ACTIVATION-CONTRACT-001
        priority: P0
        type: ARCHITECTURE
        risks: [PSR-004, PSR-005, PSR-014]
        dependencies: [PROJECT-STATE-RECONCILIATION-001]
        acceptance:
          - Manifest, lifecycle, scope precedence, guards and retention semantics accepted.
      - id: SECRET-HYGIENE-001
        priority: P0
        type: SECURITY
        risks: [PSR-021]
        dependencies: []
        acceptance:
          - No active or reusable credentials appear in logs, repository or artifacts.
      - id: DEPENDENCY-PROVENANCE-001
        priority: P0
        type: SUPPLY_CHAIN
        risks: [PSR-017, PSR-023, PSR-016]
        dependencies: [SECRET-HYGIENE-001]
        acceptance:
          - Locked hashed dependencies, pinned image digests, SBOM and build provenance.
      - id: DEPLOYMENT-PROFILE-001
        priority: P0
        type: DEPLOYMENT
        risks: [PSR-003, PSR-022, PSR-018]
        dependencies: [DEPENDENCY-PROVENANCE-001]
        acceptance:
          - Unsafe pilot/production configuration refuses to start.
          - Deploy and external TLS/session checks pass.
      - id: BACKUP-RESTORE-DRILL-001
        priority: P0
        type: DISASTER_RECOVERY
        risks: [PSR-015, PSR-013]
        dependencies: [DEPLOYMENT-PROFILE-001]
        acceptance:
          - Restore certificate records checksum, RPO/RTO, duration, counts and integrity.
      - id: SECURITY-BASELINE-001
        priority: P0
        type: SECURITY_ARCHITECTURE
        risks: [PSR-022, PSR-023, PSR-024, PSR-033]
        dependencies: [DEPLOYMENT-PROFILE-001]
        acceptance:
          - Threat model, hardening controls and negative tests accepted.
  - id: 2
    name: Modular platform control plane
    objective: Implement scoped optional modules without dynamic Django app loading.
    work_items:
      - id: MODULE-REGISTRY-001
        priority: P0
        type: PRODUCT_PLATFORM
        risks: [PSR-004, PSR-005]
        dependencies: [MODULE-ACTIVATION-CONTRACT-001, SECURITY-BASELINE-001]
        acceptance:
          - Mixed module sets work across organizations, sites and workplaces.
          - Deactivation blocks new actions and preserves readable history.
      - id: MODULE-BOUNDARY-GATES-001
        priority: P1
        type: ARCHITECTURE_AUTOMATION
        risks: [PSR-006, PSR-007]
        dependencies: [MODULE-ACTIVATION-CONTRACT-001]
        acceptance:
          - Dependency graph is cycle-free and forbidden imports fail CI.
          - Maintainability hotspots have owners and new ignores require explicit decisions.
  - id: 3
    name: Data reliability and controlled release
    objective: Make data integrity, upgrade and rollback auditable and repeatable.
    work_items:
      - id: DATA-INTEGRITY-HARDENING-001
        priority: P0
        type: DATA_RELIABILITY
        risks: [PSR-011, PSR-012]
        dependencies: [DEPLOYMENT-PROFILE-001]
        acceptance:
          - Least-privilege writes and periodic digest/audit integrity reports.
      - id: MIGRATION-SAFETY-001
        priority: P0
        type: MIGRATION_ENGINEERING
        risks: [PSR-013]
        dependencies: [BACKUP-RESTORE-DRILL-001]
        acceptance:
          - Representative N-1/N-2 databases upgrade with preserved invariants.
      - id: MODULE-MIGRATION-COMPATIBILITY-001
        priority: P0
        type: MIGRATION_TESTING
        risks: [PSR-013, PSR-014]
        dependencies: [MODULE-REGISTRY-001, MIGRATION-SAFETY-001]
        acceptance:
          - Active/inactive module combinations upgrade and reactivate without data loss.
      - id: DATA-GOVERNANCE-001
        priority: P1
        type: DATA_GOVERNANCE
        risks: [PSR-026, PSR-032]
        dependencies: [DATA-INTEGRITY-HARDENING-001]
        acceptance:
          - Classification, retention, archive, legal hold and export rules accepted.
      - id: DATA-PORTABILITY-001
        priority: P1
        type: DATA_PORTABILITY
        risks: [PSR-032]
        dependencies: [DATA-GOVERNANCE-001]
        acceptance:
          - Versioned checksummed export is round-trip verified.
      - id: RELEASE-ROLLBACK-001
        priority: P0
        type: RELEASE_ENGINEERING
        risks: [PSR-016, PSR-015]
        dependencies: [DEPENDENCY-PROVENANCE-001, MIGRATION-SAFETY-001, BACKUP-RESTORE-DRILL-001]
        acceptance:
          - Immutable release manifest and measured rollback rehearsal.
  - id: 4
    name: Operations and security completion
    objective: Detect, diagnose and contain failures and attacks.
    work_items:
      - id: OBSERVABILITY-001
        priority: P0
        type: OPERATIONS
        risks: [PSR-018, PSR-019]
        dependencies: [DEPLOYMENT-PROFILE-001, MODULE-REGISTRY-001]
        acceptance:
          - Structured logs, correlation, readiness, metrics, dashboards and alerts exercised.
      - id: INCIDENT-RESPONSE-001
        priority: P0
        type: OPERATIONS
        risks: [PSR-020]
        dependencies: [OBSERVABILITY-001, RELEASE-ROLLBACK-001]
        acceptance:
          - Severity/escalation model and technical incident exercise completed.
      - id: AUTH-RBAC-HARDENING-001
        priority: P0
        type: IDENTITY_SECURITY
        risks: [PSR-024, PSR-033]
        dependencies: [SECURITY-BASELINE-001, MODULE-REGISTRY-001]
        acceptance:
          - Privileged assurance, access reviews, break-glass and admin guards tested.
      - id: SECURITY-PIPELINE-001
        priority: P0
        type: SECURITY_AUTOMATION
        risks: [PSR-023]
        dependencies: [DEPENDENCY-PROVENANCE-001, SECURITY-BASELINE-001]
        acceptance:
          - Secret, SAST, dependency and container scans are required checks.
      - id: UPLOAD-HARDENING-001
        priority: P1
        type: APPLICATION_SECURITY
        risks: [PSR-025]
        dependencies: [SECURITY-BASELINE-001]
        acceptance:
          - All upload/import surfaces enforce centralized safety and access policy.
  - id: 5
    name: Unified UX platform
    objective: Migrate incrementally without accumulating overlays or a second design system.
    work_items:
      - id: UX-PLATFORM-FOUNDATION-001
        priority: P1
        type: UX_PLATFORM
        risks: [PSR-008, PSR-009, PSR-010]
        dependencies: [MODULE-ACTIVATION-CONTRACT-001]
        acceptance:
          - Executable primitives and standard page profiles use DEFECT and OPJ references.
      - id: LEGACY-UX-MIGRATION-001
        priority: P1
        type: UX_MIGRATION
        risks: [PSR-008]
        dependencies: [UX-PLATFORM-FOUNDATION-001]
        acceptance:
          - Route/template/static inventory and evidence-based layer removal.
      - id: UX-BROWSER-GATES-001
        priority: P1
        type: UX_TESTING
        risks: [PSR-009]
        dependencies: [DEPLOYMENT-PROFILE-001, MODULE-REGISTRY-001]
        acceptance:
          - Actual critical pilot routes on existing accepted and migrated screens pass supported browser, theme, viewport, keyboard and print gates.
          - Browser-gate execution does not require a preceding general UX refactor.
          - UX foundation and page templates are required only by a documented pilot trigger such as a new page family, journal or module UI.
      - id: PAGE-TEMPLATE-LIBRARY-001
        priority: P1
        type: UX_PLATFORM
        risks: [PSR-010]
        dependencies: [UX-PLATFORM-FOUNDATION-001]
        acceptance:
          - Registry, journal, specialist workspace and timeline profiles are reusable.
  - id: 6
    name: Knowledge and source governance
    objective: Ensure each module starts with complete and fresh evidence.
    work_items:
      - id: MODULE-SOURCE-GOVERNANCE-001
        priority: P1
        type: KNOWLEDGE_GOVERNANCE
        risks: [PSR-027]
        dependencies: [PROJECT-STATE-RECONCILIATION-001]
        acceptance:
          - Missing mandatory sources block new module work-item start after this capability is implemented.
      - id: DRIVE-LIBRARY-GOVERNANCE-001
        priority: P2
        type: KNOWLEDGE_GOVERNANCE
        risks: [PSR-028]
        dependencies: [MODULE-SOURCE-GOVERNANCE-001]
        acceptance:
          - Drive originals are checksum-traceable to GitHub metadata and decisions.
  - id: 7
    name: Pilot and independent support
    objective: Prove the platform can be operated and transferred safely.
    work_items:
      - id: PERFORMANCE-BASELINE-001
        priority: P1
        type: PERFORMANCE
        risks: [PSR-031]
        dependencies: [DEPLOYMENT-PROFILE-001, OBSERVABILITY-001]
        acceptance:
          - Workload, P95 latency, resource headroom and soak results accepted.
      - id: SUPPORT-HANDOVER-001
        priority: P0
        type: OPERATIONS_HANDOVER
        risks: [PSR-029]
        dependencies: [OBSERVABILITY-001, INCIDENT-RESPONSE-001, RELEASE-ROLLBACK-001]
        acceptance:
          - Another specialist installs, restores, upgrades, rolls back and diagnoses without oral guidance.
      - id: PILOT-READINESS-001
        priority: P0
        type: INDEPENDENT_ACCEPTANCE
        risks: [PSR-030]
        dependencies:
          - MODULE-MIGRATION-COMPATIBILITY-001
          - DATA-GOVERNANCE-001
          - SECURITY-PIPELINE-001
          - UX-BROWSER-GATES-001
          - SUPPORT-HANDOVER-001
        acceptance:
          - Mandatory pilot core is accepted.
          - Applicable critical risks are closed or explicitly accepted with compensating controls.
          - Scope-dependent and residual risks follow the PILOT-READY policies.
          - Product owner explicitly approves pilot scope and limitations.
deferred_modules:
  - id: NOTES
    classification: DECISION
    target: optional_product_module
    earliest_dependencies: [MODULE-REGISTRY-001, DATA-GOVERNANCE-001, PAGE-TEMPLATE-LIBRARY-001]
    notes: Personal and shared notes; never treated as registered operational facts by default.
  - id: MAIL-INTEGRATION
    classification: WISHLIST
    target: post_pilot_last_priority
    dependencies: []
    notes: Local Exchange integration is not a SAFE-CONTINUATION or PILOT-READY dependency.
consistency_contract:
  classification: PROPOSAL
  work_item_reference_rule:
    source: risk_register.proposed_work_item
    separators: [" -> "]
    requirement: Every referenced work item exists in phases or is explicitly listed in special_statuses.
    special_statuses: []
  dependency_reference_rule:
    requirement: Every dependency names an existing work item.
  phase_order_rule:
    requirement: A sequential phase work item cannot depend on a work item in a later phase.
  gate_reference_rule:
    requirement: Every required gate work item exists in phases.
  gate_dependency_closure_rule:
    source: gates.PILOT-READY.required_core_work_items
    traversal: direct_and_transitive
    requirement: Every direct and transitive dependency of a required core work item also appears in required_core_work_items.
    failure_conditions:
      - dependency_missing_from_program
      - dependency_outside_required_core_work_items
      - hidden_scope_dependent_dependency
  markdown_projection_rule:
    safe_continuation:
      exact_required_work_items: true
      exact_post_gate_boundaries: true
    pilot_ready:
      required_projection:
        - required_core_work_items
        - critical_risk_policy
        - scope_dependent_work_items
        - browser_gate_policy
        - residual_risk_policy
        - explicit_product_owner_decision
  validation_snapshot:
    program_version: 1.0-candidate-repair2
    method: one_off_documentation_validator
    result: PASS
    checks:
      risk_work_item_references: PASS
      dependency_references: PASS
      phase_order: PASS
      gate_work_items_exist: PASS
      gate_dependency_transitive_closure: PASS
      hidden_scope_dependent_dependencies: PASS
      hidden_scope_dependency_negative_fixture: PASS
      browser_gate_policy_projection: PASS
      markdown_yaml_gate_projection: PASS
    evidence:
      work_items: 30
      risk_register_rows: 34
      required_core_work_items: 21
      transitive_core_dependencies: 18
      dependencies_outside_required_core: []
      hidden_scope_dependent_dependencies: []
