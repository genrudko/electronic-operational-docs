name: AUTO-001B Controller CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-001b-controller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-tests:
    name: Restricted VPS controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Run current architectural gate compatibility
        run: python scripts/gate_patch_011_7.py

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/automation/bootstrap_auto001b.sh
          bash -n deploy/automation/eod-development-controller
          sh -n deploy/automation/app-entrypoint.sh

      - name: Compile request validators and tests
        run: |
          python -m compileall -q \
            scripts/automation/auto_001b_request.py \
            scripts/automation/dev_fast_001_request.py \
            tests/automation/test_auto_001b_controller.py \
            tests/automation/test_auto_001b_request_entrypoint.py

      - name: Run AUTO-001B tests with verified sanitised output
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest \
            tests.automation.test_auto_001b_controller \
            tests.automation.test_auto_001b_request_entrypoint \
            --verbose >"$RUNNER_TEMP/auto001b-tests.raw.txt" 2>&1
          test_status=$?
          set -e
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/auto001b-tests.raw.txt" \
            --output "$RUNNER_TEMP/auto001b-tests.sanitized.txt"
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/auto001b-tests.sanitized.txt"
          cat "$RUNNER_TEMP/auto001b-tests.sanitized.txt"
          exit "$test_status"

      - name: Upload verified sanitised AUTO-001B diagnostics after failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto001b-controller-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auto001b-tests.sanitized.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Verify practical boundaries
        shell: bash
        run: |
          set -euo pipefail
          controller=deploy/automation/eod-development-controller
          workflow=.github/workflows/vps-development.yml
          hot_workflow=.github/workflows/eod-hot-refresh.yml
          ! grep -F 'scripts/development_stack.sh' "$controller"
          ! grep -E 'eod-preview|eod_preview|8765|preview\.env' "$controller"
          ! grep -E 'merge_pull_request|enable_auto_merge|pull-requests: write|contents: write' "$workflow"
          ! grep -E 'merge_pull_request|enable_auto_merge|pull-requests: write|contents: write' "$hot_workflow"
          grep -F 'refs/pull/$pr_number/head' "$controller"
          grep -F 'pg_dump --format=custom' "$controller"
          grep -F 'manage.py test apps --verbosity 2' "$controller"
          grep -F 'rollback_transaction' "$controller"
          grep -F 'hot-refresh)' "$controller"
          grep -F 'group: eod-vps-development' "$hot_workflow"
          grep -F 'issue_comment:' "$hot_workflow"
          grep -F 'ref:' "$hot_workflow"
          grep -F 'github.sha' "$hot_workflow"
          grep -F 'Only added/modified files are allowed in V1' scripts/automation/dev_fast_001_request.py
          grep -F 'mode" == "100644"' tests/automation/test_auto_001b_controller.py

      - name: Remove AUTO-001B diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/auto001b-tests.raw.txt" \
            "$RUNNER_TEMP/auto001b-tests.sanitized.txt"

      - name: Verify AUTO-001B checkout remains exactly clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree
