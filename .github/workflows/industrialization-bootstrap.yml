name: Industrialization Bootstrap

on:
  push:
    branches:
      - governance/industrialization-program-execution-001

permissions:
  contents: write

concurrency:
  group: industrialization-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-and-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work-item branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge main into governance/industrialization-program-execution-001"
          git push origin HEAD:governance/industrialization-program-execution-001

      - name: Export synchronized source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > EXACT_HEAD.txt
          git rev-parse origin/main > BASE_MAIN.txt
          tar --exclude=.git -czf /tmp/eod-synchronized-source.tgz .

      - name: Upload synchronized source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eod-synchronized-source
          path: /tmp/eod-synchronized-source.tgz
          if-no-files-found: error
          retention-days: 1
