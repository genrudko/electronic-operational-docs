name: Temporary Post-Merge Coordination Projection

on:
  push:
    branches:
      - supply-chain/dependency-provenance-001
    paths:
      - .github/workflows/post-merge-secret-hygiene-projection.yml

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout projection source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Generate canonical accepted and active state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          plan_path = root / 'docs/project/DEMO_RELEASE_PLAN.yaml'
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          items = {item['id']: item for item in plan['work_items']}

          secret = items['SECRET-HYGIENE-001']
          secret.clear()
          secret.update({
              'id': 'SECRET-HYGIENE-001',
              'status': 'ACCEPTED',
              'transition': {
                  'from': 'IN_PROGRESS',
                  'to': 'ACCEPTED',
                  'evidence_reference': (
                      'PR #56 / explicit product-owner acceptance / ordinary merge commit'
                  ),
              },
              'evidence': {
                  'pr': 56,
                  'exact_head': 'cd7dc07a9c77a71a5b1166aa7a57ee4d3afa93da',
                  'merge_commit': '95b8dd6017745886f110f052ea0950b3d48173d8',
                  'workflow_runs': {
                      'eod_ci': 31078274329,
                      'auto_001a': 31078274333,
                      'auto_001b': 31078274321,
                      'documentation_contract': 31078274328,
                      'development_stack': 31078274307,
                      'secret_hygiene': 31078274346,
                  },
                  'owner_acceptance': 'PASSED',
                  'secret_scan_and_rotation_evidence': (
                      '854 tracked files / 0 findings / allowlist 0; '
                      '250 commits / 18 historical findings; '
                      '720 full tests and 17 focused regressions OK; '
                      'reusable demo credential invalidated/non-reusable; '
                      'no blind VPS or external-system rotation'
                  ),
              },
          })

          dependency = items['DEPENDENCY-PROVENANCE-001']
          dependency.clear()
          dependency.update({
              'id': 'DEPENDENCY-PROVENANCE-001',
              'status': 'IN_PROGRESS',
              'transition': {
                  'from': 'NOT_STARTED',
                  'to': 'IN_PROGRESS',
                  'evidence_reference': (
                      'issue #57 / Draft PR #58 / '
                      'supply-chain/dependency-provenance-001'
                  ),
              },
          })

          accepted = plan.setdefault('reconciliation', {}).setdefault(
              'accepted_work_items', []
          )
          if 'SECRET-HYGIENE-001' not in accepted:
              accepted.append('SECRET-HYGIENE-001')

          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          state_path = root / 'docs/project/CURRENT_STATE.md'
          state = state_path.read_text(encoding='utf-8')
          state = state.replace(
              '**Дата factual check:** 05.08.2026',
              '**Дата factual check:** 06.08.2026',
              1,
          )
          old_block = '''repository: genrudko/electronic-operational-docs
          accepted main baseline: main / 3c02c5c05cdf604bbf230d215b82ddd875ab1421
          active work item: SECRET-HYGIENE-001
          active issue: #54
          active PR: #56 / OPEN / DRAFT / NOT MERGED
          active branch: security/secret-hygiene-001
          runtime impact: DEVELOPMENT
          preview: UNTOUCHED'''
          new_block = '''repository: genrudko/electronic-operational-docs
          accepted main baseline: main / 95b8dd6017745886f110f052ea0950b3d48173d8
          active work item: DEPENDENCY-PROVENANCE-001
          active issue: #57
          active PR: #58 / OPEN / DRAFT / NOT MERGED
          active branch: supply-chain/dependency-provenance-001
          runtime impact: NONE
          preview: UNTOUCHED'''
          if old_block not in state:
              raise SystemExit('CURRENT_STATE volatile block not found')
          state = state.replace(old_block, new_block, 1)

          start = state.index('## Active SECRET-HYGIENE-001 execution')
          end = state.index('## Accepted INDUSTRIALIZATION-PROGRAM-EXECUTION-001 baseline')
          replacement = '''## Active DEPENDENCY-PROVENANCE-001 execution

          `DEPENDENCY-PROVENANCE-001` выполняется только в issue #57, ветке
          `supply-chain/dependency-provenance-001` и Draft PR #58.

          Work item ограничен supply-chain/build tooling: dependency lock,
          immutable image/action references, SBOM, build provenance и постоянные
          fail-closed gates. Runtime impact на coordination start — `NONE`.
          Live VPS и Preview не изменяются.

          Предметная очередь сохраняется в состоянии
          `PAUSED_PENDING_SAFE_CONTINUATION_AND_EXPLICIT_OWNER_DECISION`.
          `SHIFT-HANDOVER-001` не стартовал.

          ## Accepted SECRET-HYGIENE-001 baseline

          `SECRET-HYGIENE-001` принят пользователем и merged обычным merge commit:

          ```text
          accepted PR: #56 / CLOSED / MERGED
          accepted exact head: cd7dc07a9c77a71a5b1166aa7a57ee4d3afa93da
          merge commit / accepted main: 95b8dd6017745886f110f052ea0950b3d48173d8
          issue: #54 / CLOSED / COMPLETED
          user acceptance: PASSED
          merge method: ORDINARY MERGE COMMIT
          squash / rebase: NOT USED
          ```

          Принятый baseline включает единый canonical scanner, отсутствие broad
          test/fixture exemptions, process-local test credentials, exact allowlist,
          post-redaction verification, verified artifact publication, exact-head
          checkout gates и фактический clean-tree check.

          Все шесть обязательных exact-head workflows завершились успешно;
          полный suite — `720 tests / OK`, focused regressions — `17 / OK`,
          current scan — `854 files / 0 findings / allowlist 0`.

          `SAFE-CONTINUATION` после merge достигнут на 3 из 8 обязательных work
          items. Следующий зависимый элемент — `DEPENDENCY-PROVENANCE-001`.

          '''
          state = state[:start] + replacement + state[end:]
          state_path.write_text(state, encoding='utf-8')

          work_item_path = root / 'docs/work-items/active/DEPENDENCY-PROVENANCE-001/WORK_ITEM.md'
          work_item = work_item_path.read_text(encoding='utf-8')
          work_item = work_item.replace(
              'и создаваемом Draft PR.',
              'и Draft PR #58.',
              1,
          )
          work_item_path.write_text(work_item, encoding='utf-8')

          from scripts.release_plan_model import load_plan, load_program
          from scripts.release_plan_views import (
              render_checklist,
              render_module_map,
              render_program_markdown,
              render_sequence,
          )
          from scripts.industrialization_execution import load_raw, render_execution_backlog

          loaded_plan = load_plan(root)
          loaded_program = load_program(root)
          raw_program, raw_plan = load_raw(root)

          outputs = {
              'docs/product/MODULE_MAP.md': render_module_map(loaded_plan),
              'docs/product/IMPLEMENTATION_SEQUENCE.md': render_sequence(
                  loaded_plan, loaded_program
              ),
              'docs/project/DEMO_RELEASE_MASTER_CHECKLIST.md': render_checklist(
                  loaded_plan, loaded_program
              ),
              'docs/project/INDUSTRIALIZATION_PROGRAM.md': render_program_markdown(
                  raw_program
              ),
              'docs/project/INDUSTRIALIZATION_EXECUTION_BACKLOG.md': (
                  render_execution_backlog(raw_program, raw_plan)
              ),
          }
          for path, content in outputs.items():
              (root / path).write_text(content, encoding='utf-8')
          PY

      - name: Remove temporary workflow from resulting tree
        shell: bash
        run: git rm .github/workflows/post-merge-secret-hygiene-projection.yml

      - name: Validate generated projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/demo_release_plan.py
          python scripts/secret_hygiene.py scan --root .

      - name: Commit deterministic coordination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/project/DEMO_RELEASE_PLAN.yaml \
            docs/project/CURRENT_STATE.md \
            docs/product/MODULE_MAP.md \
            docs/product/IMPLEMENTATION_SEQUENCE.md \
            docs/project/DEMO_RELEASE_MASTER_CHECKLIST.md \
            docs/project/INDUSTRIALIZATION_PROGRAM.md \
            docs/project/INDUSTRIALIZATION_EXECUTION_BACKLOG.md \
            docs/work-items/active/DEPENDENCY-PROVENANCE-001/WORK_ITEM.md \
            .github/workflows/post-merge-secret-hygiene-projection.yml
          git commit -m "docs: complete SECRET-HYGIENE post-merge coordination"
          git push origin HEAD:supply-chain/dependency-provenance-001
