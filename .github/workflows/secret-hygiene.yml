name: EOD Secret Hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: sqlite
      EOD_DATABASE_PROFILE: ci
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
    steps:
      - name: Checkout exact head with bounded history
        uses: actions/checkout@v6
        with:
          fetch-depth: 250
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create masked ephemeral Django key
        shell: bash
        run: |
          set -euo pipefail
          value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '::add-mask::%s\n' "$value"
          printf 'DJANGO_SECRET_KEY=%s\n' "$value" >>"$GITHUB_ENV"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Compile checker
        run: python -m py_compile scripts/secret_hygiene.py

      - name: Run secret-hygiene fixtures
        run: python -m unittest tests.security.test_secret_hygiene -v

      - name: Run demo-access policy tests
        run: python manage.py test apps.organizations.tests.test_demo_access --verbosity 2

      - name: Validate demo bootstrap contract
        run: >-
          python scripts/secret_hygiene.py validate-demo-bootstrap
          --policy src/apps/organizations/demo_access.py
          --command src/apps/organizations/management/commands/seed_demo_organization.py
          --signals src/apps/organizations/demo_access_signals.py

      - name: Scan tracked repository content
        run: python scripts/secret_hygiene.py scan

      - name: Inventory bounded history without exposing values
        run: python scripts/secret_hygiene.py history-inventory --max-commits 250
