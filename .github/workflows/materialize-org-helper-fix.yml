name: TEMP materialize organization-structure repair

on:
  push:
    branches:
      - feature/master-data-alignment-001

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/master-data-alignment-001
          fetch-depth: 0
      - name: Apply verified repair
        shell: bash
        run: |
          set -euo pipefail
          echo "7fa80fcc67b22f79663581454a6a260e16af466a573faca762188c8317521b71  .master-data-fix/org-helper.gz.b64" | sha256sum --check
          base64 --decode .master-data-fix/org-helper.gz.b64 | gzip --decompress > src/apps/imports/organization_structure.py
          test "$(git hash-object src/apps/imports/organization_structure.py)" = "44bed466b0e63ea27b9bbf1f0f465818dbe4b726"
          python -m compileall -q src/apps/imports/organization_structure.py
          rm -rf .master-data-fix .master-data-test-result
          rm -f .github/workflows/materialize-org-helper-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "MASTER-DATA-ALIGNMENT-001: fix energy-site publication result"
          git push origin HEAD:feature/master-data-alignment-001
