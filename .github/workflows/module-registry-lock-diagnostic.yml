name: EOD Module Registry Lock Diagnostic

on:
  push:
    branches:
      - platform/module-registry-001
    paths:
      - .github/workflows/module-registry-lock-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose-lock-drift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: platform/module-registry-001
          fetch-depth: 0

      - name: Set up accepted Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Generate bounded lock drift diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import dependency_provenance_implementation as impl

          root = Path.cwd()
          accepted_dir = root / "requirements/locks"
          report = {"schema": 1, "mismatches": {}}
          with tempfile.TemporaryDirectory(prefix="eod-supply-") as directory:
              work = Path(directory)
              distributions = impl.verified_bootstrap_wheelhouse(work)
              if impl.render_bootstrap(distributions) != (root / "requirements/bootstrap.txt").read_text(encoding="utf-8"):
                  raise SystemExit("bootstrap root drift; lock diagnosis aborted")
              generator_python = impl.bootstrap_environment(work)
              candidate_dir = work / "candidate-locks"
              original = impl.LOCK_DIR
              impl.LOCK_DIR = candidate_dir
              try:
                  impl.generate_locks(generator_python, work)
              finally:
                  impl.LOCK_DIR = original
              for profile in impl.LOCK_PROFILES:
                  accepted_path = accepted_dir / f"{profile}.txt"
                  candidate_path = candidate_dir / f"{profile}.txt"
                  if accepted_path.read_bytes() == candidate_path.read_bytes():
                      continue
                  accepted = impl.parse_lock(accepted_path)
                  candidate = impl.parse_lock(candidate_path)
                  changed = {}
                  for package in sorted(set(accepted) | set(candidate)):
                      before = accepted.get(package)
                      after = candidate.get(package)
                      if before == after:
                          continue
                      changed[package] = {
                          "accepted_version": before["version"] if before else None,
                          "candidate_version": after["version"] if after else None,
                          "accepted_only_hashes": sorted(set(before["hashes"] if before else ()) - set(after["hashes"] if after else ()))[:20],
                          "candidate_only_hashes": sorted(set(after["hashes"] if after else ()) - set(before["hashes"] if before else ()))[:20],
                          "accepted_hash_count": len(before["hashes"]) if before else 0,
                          "candidate_hash_count": len(after["hashes"]) if after else 0,
                      }
                  report["mismatches"][profile] = {
                      "accepted_sha256": impl.sha256_file(accepted_path),
                      "candidate_sha256": impl.sha256_file(candidate_path),
                      "changed_packages": changed,
                  }
          target = root / "docs/work-items/active/MODULE-REGISTRY-001/LOCK_REGENERATION_DIAG.json"
          target.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("LOCK_DIAGNOSTIC_PROFILES=" + ",".join(sorted(report["mismatches"])))
          PY

      - name: Self-remove workflow and publish diagnosis to branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/module-registry-lock-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-items/active/MODULE-REGISTRY-001/LOCK_REGENERATION_DIAG.json
          git diff --cached --check
          git commit -m "Record dependency lock drift diagnosis"
          git push origin HEAD:platform/module-registry-001
