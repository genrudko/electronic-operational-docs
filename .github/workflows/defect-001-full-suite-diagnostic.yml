name: DEFECT-001 Full Suite Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: defect-001-full-suite-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Capture exact PostgreSQL gate failures
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: eod_ci
          POSTGRES_USER: eod_ci
          POSTGRES_PASSWORD: eod_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eod_ci -d eod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EOD_DEPLOYMENT_MODE: ci
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: eod_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: gate
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Mirror pre-test gate steps
        run: |
          python -m ruff check .
          python -m compileall -q manage.py src scripts
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python scripts/gate_patch_011_7.py
          python manage.py collectstatic --noinput --clear

      - name: Run exact standard suite and capture complete output
        id: tests
        shell: bash
        run: |
          set +e
          python manage.py test apps --verbosity 2 >defect-full-suite.log 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          tail -n 240 defect-full-suite.log

      - name: Upload complete suite diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: defect-001-full-suite-${{ github.sha }}
          path: defect-full-suite.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
