name: EOD CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eod-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python 3.13 / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: eod_ci
          POSTGRES_USER: eod_ci
          POSTGRES_PASSWORD: eod_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eod_ci -d eod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: eod_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: gate
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Show runtime versions
        run: |
          python --version
          python -m pip --version
          python -m django --version
          python - <<'PY'
          import psycopg

          print(f"psycopg {psycopg.__version__}")
          PY

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q manage.py src scripts

      - name: Django system check
        run: python manage.py check

      - name: Verify migration files are current
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run current architectural gate
        run: python scripts/gate_patch_011_7.py

      - name: Collect static files
        run: python manage.py collectstatic --noinput --clear

      - name: Run full Django test suite
        run: python manage.py test --verbosity 2

      - name: Verify repository remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

  notify-telegram:
    name: Telegram CI notification
    needs:
      - quality-and-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Send CI result to Telegram
        env:
          CI_RESULT: ${{ needs.quality-and-tests.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path


          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          result = os.environ.get("CI_RESULT", "unknown").strip().lower()

          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is not configured.")
          if not chat_id:
              raise SystemExit("TELEGRAM_CHAT_ID is not configured.")

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          actor = os.environ["GITHUB_ACTOR"]
          sha = os.environ["GITHUB_SHA"]
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}"

          labels = {
              "success": ("✅", "успешно"),
              "failure": ("❌", "ошибка"),
              "cancelled": ("⚪", "отменён"),
              "skipped": ("⏭", "пропущен"),
          }
          icon, result_label = labels.get(result, ("ℹ️", result))

          branch = os.environ.get("GITHUB_REF_NAME", "unknown")
          pr_url = ""
          pr_number = ""
          if event_name == "pull_request":
              pull_request = event.get("pull_request", {})
              branch = pull_request.get("head", {}).get("ref", branch)
              pr_url = pull_request.get("html_url", "")
              number = event.get("number")
              if number is not None:
                  pr_number = str(number)

          title = f"{icon} <b>EOD CI: {html.escape(result_label)}</b>"
          lines = [
              title,
              "",
              f"<b>Репозиторий:</b> <code>{html.escape(repository)}</code>",
              f"<b>Ветка:</b> <code>{html.escape(branch)}</code>",
              f"<b>Commit:</b> <code>{html.escape(sha[:12])}</code>",
              f"<b>Запуск:</b> #{html.escape(run_number)}",
          ]
          if pr_number:
              lines.append(f"<b>Pull request:</b> #{html.escape(pr_number)}")
          lines.extend(
              [
                  f"<b>Событие:</b> <code>{html.escape(event_name)}</code>",
                  f"<b>Автор:</b> <code>{html.escape(actor)}</code>",
              ]
          )

          buttons = [{"text": "Открыть GitHub Actions", "url": run_url}]
          if pr_url:
              buttons.append({"text": "Открыть PR", "url": pr_url})

          payload = {
              "chat_id": chat_id,
              "text": "\n".join(lines),
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
              "reply_markup": {"inline_keyboard": [buttons]},
          }
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response_payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"Telegram API returned HTTP {exc.code}: {body}"
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"Telegram API request failed: {exc.reason}") from None

          if not response_payload.get("ok"):
              raise SystemExit("Telegram API returned an unsuccessful response.")

          print("Telegram CI notification sent successfully.")
          PY
