name: EOD CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eod-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python 3.13 / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: eod_ci
          POSTGRES_USER: eod_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eod_ci -d eod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EOD_DEPLOYMENT_MODE: ci
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: gate
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create masked ephemeral Django key
        shell: bash
        run: |
          set -euo pipefail
          value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '::add-mask::%s\n' "$value"
          printf 'DJANGO_SECRET_KEY=%s\n' "$value" >>"$GITHUB_ENV"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Show runtime versions
        run: |
          python --version
          python -m pip --version
          python -m django --version
          python - <<'PY'
          from importlib.metadata import version

          for package in ("gunicorn", "psycopg", "whitenoise"):
              print(f"{package} {version(package)}")
          PY

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q manage.py src scripts

      - name: Django system check
        run: python manage.py check

      - name: Verify migration files are current
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run current architectural gate
        run: python scripts/gate_patch_011_7.py

      - name: Collect static files
        run: python manage.py collectstatic --noinput --clear

      - name: Run full Django test suite with verified sanitised output
        id: django-tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python manage.py test apps --verbosity 2 >"$RUNNER_TEMP/django-test.raw.txt" 2>&1
          test_status=$?
          set -e
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/django-test.raw.txt" \
            --output "$RUNNER_TEMP/django-test.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env EOD_DEMO_USER_PASSWORD
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/django-test.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env EOD_DEMO_USER_PASSWORD
          cat "$RUNNER_TEMP/django-test.sanitized.txt"
          exit "$test_status"

      - name: Build and verify sanitised Django failure report
        if: ${{ failure() && steps.django-tests.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          log_path = runner_temp / "django-test.sanitized.txt"
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          failure_headers = [
              line.strip()
              for line in lines
              if re.match(r"^(FAIL|ERROR):\s+", line.strip())
          ]
          header_indexes = [
              index
              for index, line in enumerate(lines)
              if re.match(r"^(FAIL|ERROR):\s+", line.strip())
          ]
          if header_indexes:
              start = header_indexes[0]
              while start > 0 and not (
                  lines[start - 1]
                  and set(lines[start - 1].strip()) == {"="}
              ):
                  start -= 1
              if start > 0:
                  start -= 1
              diagnostic_lines = lines[start:]
          else:
              diagnostic_lines = lines[-400:]
          summary_markers = [
              line.strip()
              for line in lines
              if line.strip().startswith(("FAILED (", "FAILED", "ERRORS", "FAILURES"))
          ]
          report_lines = [
              "EOD Django test failure diagnostics",
              f"repository: {os.environ.get('GITHUB_REPOSITORY', 'unknown')}",
              f"run_id: {os.environ.get('GITHUB_RUN_ID', 'unknown')}",
              f"run_number: {os.environ.get('GITHUB_RUN_NUMBER', 'unknown')}",
              f"commit: {os.environ.get('GITHUB_SHA', 'unknown')}",
              "",
              "failing tests:",
          ]
          if failure_headers:
              report_lines.extend(f"- {header}" for header in failure_headers)
          else:
              report_lines.append("- exact header was not detected; inspect captured tail below")
          if summary_markers:
              report_lines.extend(["", "test summary:"])
              report_lines.extend(f"- {marker}" for marker in summary_markers[-20:])
          report_lines.extend(["", "failure output:", ""])
          report_lines.extend(diagnostic_lines)
          (runner_temp / "django-test-failure.pending.txt").write_text(
              "\n".join(report_lines).rstrip() + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/django-test-failure.pending.txt" \
            --output "$RUNNER_TEMP/django-test-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env EOD_DEMO_USER_PASSWORD
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/django-test-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env EOD_DEMO_USER_PASSWORD
          cat "$RUNNER_TEMP/django-test-diagnostics.sanitized.txt"
          {
            echo "## Django test failure"
            echo
            echo "Verified sanitised diagnostics are available in the retained workflow artifact."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload verified sanitised Django failure diagnostics
        if: ${{ failure() && steps.django-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: django-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/django-test-diagnostics.sanitized.txt
            ${{ runner.temp }}/django-test.sanitized.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove Django diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/django-test.raw.txt" \
            "$RUNNER_TEMP/django-test.sanitized.txt" \
            "$RUNNER_TEMP/django-test-failure.pending.txt" \
            "$RUNNER_TEMP/django-test-diagnostics.sanitized.txt"

      - name: Verify repository remains exactly clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree

  container-preview-smoke:
    name: Container preview smoke
    needs:
      - quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: eod_preview_ci
      POSTGRES_USER: eod_preview_ci
      EOD_PREVIEW_PORT: "8765"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create masked ephemeral preview credentials
        shell: bash
        run: |
          set -euo pipefail
          django_value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          postgres_value="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf '::add-mask::%s\n' "$django_value"
          printf '::add-mask::%s\n' "$postgres_value"
          printf 'DJANGO_SECRET_KEY=%s\n' "$django_value" >>"$GITHUB_ENV"
          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_value" >>"$GITHUB_ENV"

      - name: Validate preview Compose configuration
        run: docker compose -f compose.preview.yaml config --quiet

      - name: Build preview image
        run: docker compose -f compose.preview.yaml build --pull

      - name: Start preview stack
        run: docker compose -f compose.preview.yaml up --detach

      - name: Wait for application health with verified output
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8765/_health/ >"$RUNNER_TEMP/preview-health.raw.json"; then
              python scripts/secret_hygiene.py redact \
                --input "$RUNNER_TEMP/preview-health.raw.json" \
                --output "$RUNNER_TEMP/preview-health.sanitized.json" \
                --env DJANGO_SECRET_KEY \
                --env POSTGRES_PASSWORD
              python scripts/secret_hygiene.py verify-sanitized \
                --input "$RUNNER_TEMP/preview-health.sanitized.json" \
                --env DJANGO_SECRET_KEY \
                --env POSTGRES_PASSWORD
              cat "$RUNNER_TEMP/preview-health.sanitized.json"
              exit 0
            fi
            if (( attempt % 10 == 0 )); then
              echo "Health attempt ${attempt}/45"
              docker compose -f compose.preview.yaml ps --all
            fi
            sleep 2
          done
          exit 1

      - name: Verify private port exposure
        shell: bash
        run: |
          set -euo pipefail
          app_port="$(docker compose -f compose.preview.yaml port app 8765)"
          test "$app_port" = "127.0.0.1:8765"
          if docker compose -f compose.preview.yaml port db 5432 \
            >"$RUNNER_TEMP/preview-db-port.raw.txt" 2>&1; then
            echo "PostgreSQL must not publish a host port."
            exit 1
          fi

      - name: Capture and verify sanitised preview diagnostics after failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "===== docker compose ps --all ====="
            docker compose -f compose.preview.yaml ps --all
            echo
            echo "===== docker compose logs ====="
            docker compose -f compose.preview.yaml logs --no-color
          } >"$RUNNER_TEMP/preview-diagnostics.raw.txt" 2>&1
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/preview-diagnostics.raw.txt" \
            --output "$RUNNER_TEMP/preview-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env POSTGRES_PASSWORD
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/preview-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env POSTGRES_PASSWORD
          cat "$RUNNER_TEMP/preview-diagnostics.sanitized.txt"

      - name: Upload verified sanitised preview diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-diagnostics.sanitized.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop preview stack
        if: ${{ always() }}
        run: docker compose -f compose.preview.yaml down --volumes --remove-orphans

      - name: Remove preview diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/preview-health.raw.json" \
            "$RUNNER_TEMP/preview-health.sanitized.json" \
            "$RUNNER_TEMP/preview-db-port.raw.txt" \
            "$RUNNER_TEMP/preview-diagnostics.raw.txt" \
            "$RUNNER_TEMP/preview-diagnostics.sanitized.txt"

      - name: Verify preview-smoke checkout remains exactly clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree

  notify-telegram:
    name: Telegram CI notification
    needs:
      - quality-and-tests
      - container-preview-smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Send CI result to Telegram
        env:
          QUALITY_RESULT: ${{ needs.quality-and-tests.result }}
          CONTAINER_RESULT: ${{ needs.container-preview-smoke.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          quality_result = os.environ.get("QUALITY_RESULT", "unknown").strip().lower()
          container_result = os.environ.get("CONTAINER_RESULT", "unknown").strip().lower()

          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is not configured.")
          if not chat_id:
              raise SystemExit("TELEGRAM_CHAT_ID is not configured.")

          results = {quality_result, container_result}
          if "failure" in results:
              result = "failure"
          elif "cancelled" in results:
              result = "cancelled"
          elif results == {"success"}:
              result = "success"
          elif "skipped" in results:
              result = "skipped"
          else:
              result = "unknown"

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          actor = os.environ["GITHUB_ACTOR"]
          sha = os.environ["GITHUB_SHA"]
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}"

          labels = {
              "success": ("✅", "успешно"),
              "failure": ("❌", "ошибка"),
              "cancelled": ("⚪", "отменён"),
              "skipped": ("⏭", "пропущен"),
          }
          icon, result_label = labels.get(result, ("ℹ️", result))

          branch = os.environ.get("GITHUB_REF_NAME", "unknown")
          pr_url = ""
          pr_number = ""
          if event_name == "pull_request":
              pull_request = event.get("pull_request", {})
              branch = pull_request.get("head", {}).get("ref", branch)
              pr_url = pull_request.get("html_url", "")
              number = event.get("number")
              if number is not None:
                  pr_number = str(number)

          title = f"{icon} <b>EOD CI: {html.escape(result_label)}</b>"
          lines = [
              title,
              "",
              f"<b>Репозиторий:</b> <code>{html.escape(repository)}</code>",
              f"<b>Ветка:</b> <code>{html.escape(branch)}</code>",
              f"<b>Commit:</b> <code>{html.escape(sha[:12])}</code>",
              f"<b>Запуск:</b> #{html.escape(run_number)}",
          ]
          if pr_number:
              lines.append(f"<b>Pull request:</b> #{html.escape(pr_number)}")
          lines.extend(
              [
                  f"<b>Python/PostgreSQL:</b> <code>{html.escape(quality_result)}</code>",
                  f"<b>Container preview:</b> <code>{html.escape(container_result)}</code>",
                  f"<b>Событие:</b> <code>{html.escape(event_name)}</code>",
                  f"<b>Автор:</b> <code>{html.escape(actor)}</code>",
              ]
          )

          buttons = [{"text": "Открыть GitHub Actions", "url": run_url}]
          if pr_url:
              buttons.append({"text": "Открыть PR", "url": pr_url})

          payload = {
              "chat_id": chat_id,
              "text": "\n".join(lines),
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
              "reply_markup": {"inline_keyboard": [buttons]},
          }
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response_payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"Telegram API returned HTTP {exc.code}: {body}"
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"Telegram API request failed: {exc.reason}") from None

          if not response_payload.get("ok"):
              raise SystemExit("Telegram API returned an unsuccessful response.")

          print("Telegram CI notification sent successfully.")
          PY
