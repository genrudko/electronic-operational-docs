name: DEFECT-001 Integration Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: defect-001-integration-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Capture first full-suite integration failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: eod_ci
          POSTGRES_USER: eod_ci
          POSTGRES_PASSWORD: eod_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eod_ci -d eod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: eod_config.settings
      SECRET_KEY: ci-only-not-for-production
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: eod_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run full suite fail-fast and capture complete output
        id: tests
        shell: bash
        run: |
          set +e
          python manage.py test apps --verbosity 2 --failfast >defect-integration-tests.log 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          tail -n 200 defect-integration-tests.log

      - name: Upload full-suite diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: defect-001-integration-tests-${{ github.sha }}
          path: defect-integration-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
