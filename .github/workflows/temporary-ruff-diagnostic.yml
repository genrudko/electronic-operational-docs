name: Temporary Ruff diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"

      - name: Capture Ruff result
        id: ruff
        shell: bash
        run: |
          set +e
          python -m ruff check . --output-format=concise >ruff-diagnostic.txt 2>&1
          rc=$?
          cat ruff-diagnostic.txt
          echo "exit_code=$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload Ruff diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: temporary-ruff-diagnostic-${{ github.run_id }}
          path: ruff-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve Ruff outcome
        shell: bash
        env:
          RUFF_EXIT_CODE: ${{ steps.ruff.outputs.exit_code }}
        run: exit "$RUFF_EXIT_CODE"
