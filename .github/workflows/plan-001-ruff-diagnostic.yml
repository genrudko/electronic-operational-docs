name: PLAN-001 Ruff Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Capture canonical Ruff diff
        shell: bash
        run: |
          set +e
          python -m ruff check scripts/plan_001_evidence_audit.py \
            --fix --diff >plan-001-ruff.txt 2>&1
          rc=$?
          set -e
          cat plan-001-ruff.txt
          printf '%s\n' "$rc" >plan-001-ruff.rc
      - name: Upload Ruff report
        uses: actions/upload-artifact@v7
        with:
          name: plan-001-ruff-${{ github.sha }}
          path: |
            plan-001-ruff.txt
            plan-001-ruff.rc
          if-no-files-found: error
          retention-days: 1
      - name: Enforce Ruff result
        shell: bash
        run: test "$(cat plan-001-ruff.rc)" = "0"
