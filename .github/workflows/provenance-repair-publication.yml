name: Publish verified provenance repair

on:
  push:
    branches:
      - supply-chain/dependency-provenance-001

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
