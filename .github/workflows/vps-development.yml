name: EOD Trusted Development Controller

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: eod-vps-development
  cancel-in-progress: false

jobs:
  validate-trusted-request:
    name: Validate trusted exact-SHA request
    if: >-
      github.event.label.name == 'vps-development-refresh' ||
      github.event.label.name == 'vps-development-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      deployment_profile: ${{ steps.validate.outputs.deployment_profile }}
      trusted_workflow_sha: ${{ steps.validate.outputs.trusted_workflow_sha }}

    steps:
      - name: Checkout trusted controller from main event SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = "pull_request_target"
          echo "Trusted controller SHA: $GITHUB_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Collect live GitHub request facts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pullRequest = context.payload.pull_request;
            if (!pullRequest || !Number.isInteger(pullRequest.number)) {
              core.setFailed('pull_request_target payload has no valid pull request number.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pullRequest.number;
            const { data: livePr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const { data: permission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: context.actor,
              });
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              },
              (response) => response.data.map((item) => {
                const changedFile = { filename: item.filename };
                if (item.previous_filename) {
                  changedFile.previous_filename = item.previous_filename;
                }
                return changedFile;
              }),
            );
            const { data: workflowData } =
              await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                event: 'pull_request',
                head_sha: livePr.head.sha,
                per_page: 100,
              });
            const request = {
              observed_at: new Date().toISOString(),
              event: {
                repository: `${owner}/${repo}`,
                action: context.payload.action,
                label: context.payload.label?.name ?? '',
                actor: context.actor,
                pr_number: prNumber,
                base_ref: pullRequest.base?.ref ?? '',
                head_sha: pullRequest.head?.sha ?? '',
                head_repo_full_name: pullRequest.head?.repo?.full_name ?? '',
                workflow_run_id: context.runId,
                workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                trusted_workflow_sha: context.sha,
              },
              live_pr: {
                number: livePr.number,
                state: livePr.state,
                base_ref: livePr.base.ref,
                head_ref: livePr.head.ref,
                head_sha: livePr.head.sha,
                head_repo_full_name: livePr.head.repo?.full_name ?? '',
              },
              actor_permission: permission.permission,
              changed_files: changedFiles,
              workflow_runs: workflowData.workflow_runs.map((run) => ({
                id: run.id,
                run_attempt: run.run_attempt,
                name: run.name,
                head_sha: run.head_sha,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
              })),
            };
            fs.writeFileSync(
              'auto001b-request.json',
              `${JSON.stringify(request, null, 2)}\n`,
              { encoding: 'utf8', mode: 0o600 },
            );

      - name: Validate repository, actor, PR, paths and exact-SHA checks
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.automation.auto_001b_request validate \
            --request auto001b-request.json \
            --policy .github/auto001a-foundation.json \
            --summary auto001b-summary.md \
            --outputs "$GITHUB_OUTPUT"
          python scripts/secret_hygiene.py redact --input auto001b-summary.md --output auto001b-summary.sanitized.md
          cat auto001b-summary.sanitized.md >>"$GITHUB_STEP_SUMMARY"
          rm -f auto001b-summary.md

  deploy-development:
    name: Verify exact SHA on isolated development VPS
    needs:
      - validate-trusted-request
    if: ${{ needs.validate-trusted-request.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      VPS_HOST: ${{ secrets.EOD_VPS_HOST }}
      VPS_PORT: ${{ secrets.EOD_VPS_PORT }}
      VPS_KEY: ${{ secrets.EOD_VPS_SSH_PRIVATE_KEY }}
      VPS_HOST_KEY: ${{ secrets.EOD_VPS_HOST_KEY }}
      PR_NUMBER: ${{ needs.validate-trusted-request.outputs.pr_number }}
      HEAD_SHA: ${{ needs.validate-trusted-request.outputs.head_sha }}
      PROFILE: ${{ needs.validate-trusted-request.outputs.deployment_profile }}

    steps:
      - name: Checkout trusted redaction utility from main event SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate connection configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_KEY"
          test -n "$VPS_HOST_KEY"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure restricted SSH client
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" >"$HOME/.ssh/eod_automation"
          chmod 0600 "$HOME/.ssh/eod_automation"
          printf '%s\n' "$VPS_HOST_KEY" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Run fixed VPS controller for exact SHA with sanitised output
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >>"$GITHUB_OUTPUT"
          raw_file="$(mktemp)"
          set +e
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/eod_automation" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "eod-automation@$VPS_HOST" \
            "deploy $PROFILE $PR_NUMBER $HEAD_SHA $GITHUB_RUN_ID" \
            >"$raw_file" 2>&1
          rc=$?
          set -e
          python scripts/secret_hygiene.py redact --input "$raw_file" --output vps-controller.sanitized.txt --env VPS_HOST --env VPS_PORT --env VPS_KEY --env VPS_HOST_KEY
          rm -f "$raw_file"
          cat vps-controller.sanitized.txt
          printf 'result_code=%s\n' "$rc" >>"$GITHUB_OUTPUT"
          {
            echo "## VPS controller"
            echo
            echo "Sanitised controller output was written to the workflow log."
            echo
            echo "Result code: \`$rc\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Stop on controller error
        if: ${{ steps.deploy.outputs.result_code != '0' }}
        shell: bash
        run: |
          echo "# AUTO-001B result: ERROR" >>"$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Re-check live PR head after VPS verification
        id: live
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            core.setOutput('head_sha', pr.head.sha);

      - name: Confirm result or rollback stale SHA
        shell: bash
        env:
          LIVE_SHA: ${{ steps.live.outputs.head_sha }}
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -p "$VPS_PORT"
            -i "$HOME/.ssh/eod_automation"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            "eod-automation@$VPS_HOST"
          )
          if [[ "$LIVE_SHA" != "$HEAD_SHA" ]]; then
            "${ssh_base[@]}" "rollback $GITHUB_RUN_ID"
            {
              echo "# AUTO-001B result: STALE SHA"
              echo
              echo "Expected: \`$HEAD_SHA\`"
              echo "Current:  \`$LIVE_SHA\`"
              echo "Development rollback: completed"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          "${ssh_base[@]}" "confirm $GITHUB_RUN_ID $HEAD_SHA"
          {
            echo "# AUTO-001B result: SUCCESS"
            echo
            echo "Exact SHA: \`$HEAD_SHA\`"
            echo "Development: updated"
            echo "Preview: untouched"
            echo "Automatic merge: absent"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Roll back an unconfirmed deployment with sanitised output
        if: ${{ (failure() || cancelled()) && steps.deploy.outputs.attempted == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          raw_file="$(mktemp)"
          set +e
          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/eod_automation" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "eod-automation@$VPS_HOST" \
            "rollback-pending" >"$raw_file" 2>&1
          rollback_rc=$?
          set -e
          python scripts/secret_hygiene.py redact --input "$raw_file" --output vps-rollback.sanitized.txt --env VPS_HOST --env VPS_PORT --env VPS_KEY --env VPS_HOST_KEY
          rm -f "$raw_file"
          cat vps-rollback.sanitized.txt
          {
            echo
            echo "Fallback rollback was requested because the VPS deployment was not confirmed."
            echo "Fallback rollback result code: \`$rollback_rc\`"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rollback_rc"
