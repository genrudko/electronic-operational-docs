name: AUTO-001A Foundation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-001a-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-regression-tests:
    name: Trusted foundation regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual_sha"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Compile AUTO-001A sources and tests
        run: |
          python -m compileall -q \
            scripts/automation/auto_001a_foundation.py \
            tests/automation/test_auto_001a_foundation.py

      - name: Ruff AUTO-001A sources and tests
        run: |
          python -m ruff check \
            scripts/automation/auto_001a_foundation.py \
            tests/automation/test_auto_001a_foundation.py

      - name: Run AUTO-001A tests with verified sanitised output
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest discover \
            --start-directory tests/automation \
            --pattern 'test_auto_001a_*.py' \
            --verbose >"$RUNNER_TEMP/auto001a-tests.raw.txt" 2>&1
          test_status=$?
          set -e
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/auto001a-tests.raw.txt" \
            --output "$RUNNER_TEMP/auto001a-tests.sanitized.txt"
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/auto001a-tests.sanitized.txt"
          printf 'verified=true\n' >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/auto001a-tests.sanitized.txt"
          exit "$test_status"

      - name: Upload verified sanitised AUTO-001A diagnostics
        if: ${{ always() && steps.tests.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto001a-foundation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auto001a-tests.sanitized.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove AUTO-001A diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/auto001a-tests.raw.txt" \
            "$RUNNER_TEMP/auto001a-tests.sanitized.txt"

      - name: Verify AUTO-001A checkout remains exactly clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree
