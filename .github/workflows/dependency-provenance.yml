name: EOD Dependency Provenance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - supply-chain/dependency-provenance-001
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate immutable supply chain contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED_SHA"

      - name: Detect controlled regeneration request
        id: mode
        run: |
          set -euo pipefail
          if [[ -f supply-chain/regeneration-request.json ]]; then
            printf 'regenerate=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'regenerate=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Set up accepted Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements/locks/*.txt

      - name: Regenerate registry, locks and immutable references
        if: steps.mode.outputs.regenerate == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/dependency_provenance_implementation.py apply
          python scripts/dependency_provenance_implementation.py verify-locks
          python scripts/publish_workflow_blobs.py
          git diff --check
          git add --all
          python scripts/secret_hygiene.py scan

      - name: Commit controlled non-workflow regeneration
        if: steps.mode.outputs.regenerate == 'true'
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f supply-chain/regeneration-request.json
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish exact workflow blob manifest'
          git push origin HEAD:supply-chain/dependency-provenance-001

      - name: Verify five semantic hashed locks
        if: steps.mode.outputs.regenerate == 'false'
        run: python scripts/dependency_provenance_implementation.py verify-locks

      - name: Validate registry, refs, install paths and source completeness
        if: steps.mode.outputs.regenerate == 'false'
        run: python scripts/dependency_provenance_contract.py validate-repository

      - name: Verify repository remains exactly clean
        if: steps.mode.outputs.regenerate == 'false'
        run: python scripts/secret_hygiene.py verify-clean-tree
