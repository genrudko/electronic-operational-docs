name: EOD Dependency Provenance

# Permanent implementation/verification controller for DEPENDENCY-PROVENANCE-001.
on:
  push:
    branches:
      - supply-chain/dependency-provenance-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement-or-verify:
    name: Bootstrap and verify immutable supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED_SHA"

      - name: Set up accepted Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          check-latest: false
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Materialise registry, five locks and immutable references
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'supply-chain/dependency-provenance-001')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/dependency_provenance_implementation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PIP_VERSION = "26.2.1"', 'PIP_VERSION = "25.3"')
          start = text.index('def marker_applies(')
          end = text.index('\n\ndef requirement_name', start)
          replacement = '''def marker_applies(requirement: str) -> bool:
              # pip download already evaluates markers for the accepted interpreter and
              # platform. The subsequent no-index/require-hashes install is the
              # fail-closed wheelhouse-completeness proof.
              return False
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('import base64\n', '').replace('import shutil\n', '')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/dependency_provenance_implementation.py apply
          python scripts/dependency_provenance_implementation.py verify-locks
          git diff --check

      - name: Stage and scan generated repository state
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'supply-chain/dependency-provenance-001')
        run: |
          set -euo pipefail
          git add --all
          python scripts/secret_hygiene.py scan

      - name: Export deterministic materialization
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'supply-chain/dependency-provenance-001')
        env:
          OUTPUT_DIR: ${{ runner.temp }}/dependency-provenance-materialization
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          output = Path(os.environ['OUTPUT_DIR'])
          files_root = output / 'files'
          files_root.mkdir(parents=True, exist_ok=True)
          raw = subprocess.run(
              ['git', 'diff', '--cached', '--name-only', '-z'],
              check=True,
              capture_output=True,
          ).stdout
          paths = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          manifest = {
              'schema': 1,
              'base_head': subprocess.run(
                  ['git', 'rev-parse', 'HEAD'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
              'files': [],
          }
          for relative in paths:
              source = root / relative
              if not source.exists():
                  manifest['files'].append({'path': relative, 'deleted': True})
                  continue
              target = files_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              content = source.read_bytes()
              manifest['files'].append(
                  {
                      'path': relative,
                      'deleted': False,
                      'size': len(content),
                      'sha256': hashlib.sha256(content).hexdigest(),
                  }
              )
          (output / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          (output / 'cached.diff').write_bytes(
              subprocess.run(
                  ['git', 'diff', '--cached', '--binary', '--full-index'],
                  check=True,
                  capture_output=True,
              ).stdout
          )
          PY
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$OUTPUT_DIR/manifest.json"

      - name: Upload verified materialization
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'supply-chain/dependency-provenance-001')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-provenance-materialization
          path: ${{ runner.temp }}/dependency-provenance-materialization
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Commit non-workflow materialization
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'supply-chain/dependency-provenance-001')
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git add --all
          if [[ -z "$(git diff --cached --name-only)" ]]; then
            echo 'NON_WORKFLOW_MATERIALIZATION=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialise dependency provenance contract'
          git push origin HEAD:supply-chain/dependency-provenance-001

      - name: Validate committed registry and locks
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          set -euo pipefail
          python scripts/dependency_provenance_implementation.py verify-locks
          python scripts/dependency_provenance_contract.py validate-repository
          git diff --check
          test -z "$(git status --porcelain=v1)"
