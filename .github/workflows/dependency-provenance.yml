name: EOD Dependency Provenance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - supply-chain/dependency-provenance-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate immutable supply chain contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED_SHA"

      - name: Set up accepted Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements/locks/*.txt

      - name: Verify five semantic hashed locks
        run: |
          set -euo pipefail
          python scripts/dependency_provenance_implementation.py verify-locks

      - name: Validate registry, refs, install paths and source completeness
        run: |
          set -euo pipefail
          python scripts/dependency_provenance_contract.py validate-repository

      - name: Verify repository remains exactly clean
        run: python scripts/secret_hygiene.py verify-clean-tree
