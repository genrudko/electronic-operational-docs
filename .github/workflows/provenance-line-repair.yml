name: Materialize remaining provenance allowlist coordinates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: supply-chain/dependency-provenance-001
          fetch-depth: 0
      - name: Create exact repaired registry blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          path = Path('supply-chain/registry.json')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '{"call":"subprocess.run","line":134,"path":"scripts/dependency_provenance_implementation.py"':
              '{"call":"subprocess.run","line":139,"path":"scripts/dependency_provenance_implementation.py"',
              '{"call":"subprocess.run","line":484,"path":"scripts/dependency_provenance_implementation.py"':
              '{"call":"subprocess.run","line":489,"path":"scripts/dependency_provenance_implementation.py"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1 or new in text:
                  raise SystemExit(f'unexpected allowlist source state: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          raw = path.read_bytes()
          payload = json.dumps({'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'}).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/genrudko/electronic-operational-docs/git/blobs',
              data=payload, method='POST',
              headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
          )
          with urllib.request.urlopen(request) as response:
              sha = json.load(response)['sha']
          print(f'REGISTRY_BLOB={sha}')
          print(f'REGISTRY_SHA256={hashlib.sha256(raw).hexdigest()}')
          PY
