name: TMP Security Inventory Finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Remove temporary workflow and regenerate final-tree inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_tmp-security-inventory-finalize.yml
          python scripts/dependency_provenance_views.py write
          git diff --check
          git status --short
          printf '%s\n' \
            '.github/workflows/_tmp-security-inventory-finalize.yml' \
            'docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.02.json' \
            'docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.json' \
            'docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.md' \
            | sort >"$RUNNER_TEMP/expected.txt"
          git status --short | sed -E 's/^.. //' | sort >"$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Commit generated final-tree inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: regenerate dependency inventory for security baseline'
          git push origin HEAD:security/security-baseline-001
