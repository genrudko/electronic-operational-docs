name: EOD Module Registry Format Finalize

on:
  push:
    branches:
      - platform/module-registry-001
    paths:
      - .github/workflows/module-registry-format-finalize.yml

permissions:
  contents: write

jobs:
  finalize-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: platform/module-registry-001
          fetch-depth: 0

      - name: Normalize focused test spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/apps/system/tests/test_module_registry.py')
          text = path.read_text(encoding='utf-8')
          old = '\n\n\n    def test_direct_rule_save_bypass_is_rejected'
          new = '\n\n    def test_direct_rule_save_bypass_is_rejected'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('final test spacing anchor missing')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Self-remove and regenerate dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/module-registry-format-finalize.yml
          python scripts/dependency_provenance_views.py write

      - name: Commit final formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize final module registry test formatting"
          git push origin HEAD:platform/module-registry-001
