name: UX Platform Source Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-platform-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Generic presentation ownership guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EOD_DEPLOYMENT_MODE: ci
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: gate
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual_sha"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/locks/*.txt

      - name: Create masked ephemeral Django key
        shell: bash
        run: |
          set -euo pipefail
          value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '::add-mask::%s\n' "$value"
          printf 'DJANGO_SECRET_KEY=%s\n' "$value" >>"$GITHUB_ENV"

      - name: Install gate dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/runtime.txt

      - name: Run UX Platform source contract
        run: python manage.py test apps.system.tests.test_ux_platform_migration_contract --verbosity 2

      - name: Verify checkout remains clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree
