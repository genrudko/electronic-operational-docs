name: EOD Module Registry Inventory Finalize

on:
  push:
    branches:
      - platform/module-registry-001
    paths:
      - .github/workflows/module-registry-inventory-finalize.yml

permissions:
  contents: write

jobs:
  finalize-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: platform/module-registry-001
          fetch-depth: 0

      - name: Remove one-shot workflow before inventory generation
        run: git rm .github/workflows/module-registry-inventory-finalize.yml

      - name: Regenerate canonical dependency inventory
        run: python scripts/dependency_provenance_views.py write

      - name: Commit final inventory and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY*.json
          git add docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.md
          git diff --cached --check
          git commit -m "Regenerate dependency inventory for module registry"
          git push origin HEAD:platform/module-registry-001
