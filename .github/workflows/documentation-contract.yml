name: EOD Documentation Contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: eod-industrialization-assembly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  industrialization-assembly:
    if: github.event.pull_request.head.ref == 'governance/industrialization-program-execution-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Materialize canonical files and verify exact blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          entries = {
              "demo_plan.b64": (
                  "docs/project/DEMO_RELEASE_PLAN.yaml",
                  "6656f59c569f4a68e7f02f136627edb6671b7b66",
              ),
              "program.b64": (
                  "docs/project/INDUSTRIALIZATION_PROGRAM.yaml",
                  "c93d7cfdde228b3889f1644c6b15f52bf1e5c8dd",
              ),
              "backlog.b64": (
                  "docs/project/INDUSTRIALIZATION_EXECUTION_BACKLOG.md",
                  "ae532fb1181964f3a7cf90a1577d961851aee32b",
              ),
              "execution.b64": (
                  "scripts/industrialization_execution.py",
                  "943bc3825f4d9205234a597140e1d3787f9e491b",
              ),
          }
          source_root = Path(".github/industrialization-assembly")
          for payload_name, (target_name, expected_sha) in entries.items():
              payload = (source_root / payload_name).read_text(encoding="utf-8")
              content = gzip.decompress(base64.b64decode(payload))
              actual_sha = hashlib.sha1(
                  f"blob {len(content)}\0".encode("ascii") + content
              ).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"{target_name}: expected {expected_sha}, actual {actual_sha}"
                  )
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              print(f"verified {target_name}: {actual_sha}")
          PY

      - name: Run focused execution-contract tests
        run: >-
          python -m unittest -v
          tests.process.test_project_state_contract
          tests.process.test_release_plan_compatibility
          tests.process.test_module_contract_status_projection
          tests.process.test_industrialization_execution

      - name: Validate final documentation contract
        run: python scripts/check_documentation_contract.py

      - name: Commit materialized canonical files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/project/DEMO_RELEASE_PLAN.yaml \
            docs/project/INDUSTRIALIZATION_PROGRAM.yaml \
            docs/project/INDUSTRIALIZATION_EXECUTION_BACKLOG.md \
            scripts/industrialization_execution.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Canonical files already materialized."
            exit 0
          fi
          git commit -m "feat: materialize industrialization execution contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
