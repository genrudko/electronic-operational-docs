name: EOD Documentation Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eod-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-contract:
    name: Canonical documentation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Git whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Compile documentation checkers
        run: >-
          python -m compileall -q
          scripts/check_documentation_contract.py
          scripts/check_documentation_contract_core.py
          scripts/check_demo_release_plan.py
          scripts/demo_release_plan.py
          scripts/project_state_contract.py
          scripts/release_plan_compat_validation.py
          scripts/module_contract_status_projection.py
          scripts/industrialization_execution.py
          tests/process/test_project_state_contract.py
          tests/process/test_release_plan_compatibility.py
          tests/process/test_module_contract_status_projection.py
          tests/process/test_industrialization_execution.py

      - name: Run project-state contract regressions
        run: >-
          python -m unittest -v
          tests.process.test_project_state_contract
          tests.process.test_release_plan_compatibility
          tests.process.test_module_contract_status_projection
          tests.process.test_industrialization_execution

      - name: Validate documentation contract
        run: python scripts/check_documentation_contract.py

      - name: Confirm clean checkout
        run: git diff --exit-code
