name: EOD Documentation Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eod-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-contract:
    name: Canonical documentation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual_sha"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check Git whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Compile documentation checkers
        run: >-
          python -m compileall -q
          scripts/check_documentation_contract.py
          scripts/check_documentation_contract_core.py
          scripts/check_demo_release_plan.py
          scripts/demo_release_plan.py
          scripts/project_state_contract.py
          scripts/release_plan_compat_validation.py
          scripts/module_contract_status_projection.py
          scripts/industrialization_execution.py
          scripts/dependency_provenance_inventory.py scripts/dependency_provenance_views.py
          scripts/secret_hygiene.py
          tests/process/test_project_state_contract.py
          tests/process/test_release_plan_compatibility.py
          tests/process/test_module_contract_status_projection.py
          tests/process/test_industrialization_execution.py
          tests/process/test_dependency_provenance_inventory.py

      - name: Regenerate dependency inventory views
        run: python scripts/dependency_provenance_views.py write

      - name: Prepare verified sanitised inventory drift evidence
        id: inventory_evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/dependency-inventory-generated-views"
          mkdir -p "$evidence_dir"
          for source in docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY*; do
            name="${source##*/}"
            target="$evidence_dir/$name"
            python scripts/secret_hygiene.py redact \
              --input "$source" \
              --output "$target"
            python scripts/secret_hygiene.py verify-sanitized --input "$target"
            cmp --silent "$source" "$target"
          done
          printf 'verified=true\n' >>"$GITHUB_OUTPUT"

      - name: Run project-state and dependency-contract regressions
        run: >-
          python -m unittest -v
          tests.process.test_project_state_contract
          tests.process.test_release_plan_compatibility
          tests.process.test_module_contract_status_projection
          tests.process.test_industrialization_execution
          tests.process.test_dependency_provenance_inventory

      - name: Verify generated dependency inventory is exact
        run: >-
          git diff --exit-code --
          docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.json
          docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.md docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.*.json

      - name: Upload verified inventory drift evidence after failure
        if: ${{ failure() && steps.inventory_evidence.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory-generated-views
          path: ${{ runner.temp }}/dependency-inventory-generated-views
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Validate dependency inventory contract
        run: python scripts/dependency_provenance_views.py check

      - name: Validate documentation contract
        run: python scripts/check_documentation_contract.py

      - name: Remove dependency inventory diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/dependency-inventory-generated-views"

      - name: Confirm clean checkout
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree

  publish-generated-inventory:
    name: One-shot exact generated inventory transport
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ux/ux-platform-foundation-001' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout transport head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Restore final workflow and regenerate exact views
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "chore(transport): self-revert and publish generated inventory"
          git show HEAD^:.github/workflows/documentation-contract.yml > .github/workflows/documentation-contract.yml
          python scripts/dependency_provenance_views.py write
          python scripts/dependency_provenance_views.py check
          test "$(git hash-object .github/workflows/documentation-contract.yml)" = "79ae97272974ccc81112cfc0ec3c6cb3e6d73f80"

      - name: Verify generated views are publication-safe
        shell: bash
        run: |
          set -euo pipefail
          for source in docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY*; do
            python scripts/secret_hygiene.py verify-sanitized --input "$source"
          done

      - name: Atomically publish self-reverted workflow and generated views
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["EXPECTED_HEAD"]
          branch = os.environ["TARGET_BRANCH"]
          root = Path.cwd()
          paths = [
              ".github/workflows/documentation-contract.yml",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.md",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.01.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.02.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.03.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.04.json",
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "eod-generated-inventory-transport/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          live = request("GET", f"/git/ref/heads/{branch}")["object"]["sha"]
          if live != expected_head:
              raise SystemExit(f"stale transport head: live={live} expected={expected_head}")

          base_commit = request("GET", f"/git/commits/{expected_head}")
          tree_entries = []
          for relative in paths:
              content = (root / relative).read_bytes()
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              tree_entries.append(
                  {
                      "path": relative,
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob["sha"],
                  }
              )
              print(f"GENERATED_BLOB path={relative} sha={blob['sha']}")

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": base_commit["tree"]["sha"], "tree": tree_entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "chore(supply-chain): finalize generated dependency inventory",
                  "tree": tree["sha"],
                  "parents": [expected_head],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{branch}",
              {"sha": commit["sha"], "force": False},
          )
          print(f"FINAL_GENERATED_HEAD={commit['sha']}")
          PY
