name: EOD Documentation Contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: eod-industrialization-lint-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  industrialization-lint-repair:
    if: github.event.pull_request.head.ref == 'governance/industrialization-program-execution-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Materialize lint repairs and verify exact blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          source_root = Path(".github/industrialization-lint-repair")
          payloads = {
              "scripts/demo_release_plan.py": (
                  (source_root / "demo.b64").read_text(encoding="utf-8"),
                  "d280865bf6da478ece98fabddcca3c62d882c13f",
              ),
              "scripts/industrialization_execution.py": (
                  "".join(
                      (source_root / f"execution.part{index:02d}").read_text(
                          encoding="utf-8"
                      )
                      for index in range(4)
                  ),
                  "072b7eef825ce637ca2a37e61f862b55da0b4650",
              ),
              "tests/process/test_project_state_contract.py": (
                  (source_root / "test_state.b64").read_text(encoding="utf-8"),
                  "8c663357071a5ebedb929ddf20415df711a68d17",
              ),
          }
          for target_name, (payload, expected_sha) in payloads.items():
              content = gzip.decompress(base64.b64decode(payload))
              actual_sha = hashlib.sha1(
                  f"blob {len(content)}\0".encode("ascii") + content
              ).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"{target_name}: expected {expected_sha}, actual {actual_sha}"
                  )
              target = Path(target_name)
              target.write_bytes(content)
              print(f"verified {target_name}: {actual_sha}")
          PY

      - name: Install project development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run focused execution-contract tests
        run: >-
          python -m unittest -v
          tests.process.test_project_state_contract
          tests.process.test_release_plan_compatibility
          tests.process.test_module_contract_status_projection
          tests.process.test_industrialization_execution

      - name: Validate documentation contract
        run: python scripts/check_documentation_contract.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/demo_release_plan.py \
            scripts/industrialization_execution.py \
            tests/process/test_project_state_contract.py
          git diff --cached --check
          git commit -m "fix: satisfy industrialization contract lint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
