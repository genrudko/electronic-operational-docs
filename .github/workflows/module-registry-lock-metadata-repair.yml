name: EOD Module Registry Lock Metadata Repair

on:
  push:
    branches:
      - platform/module-registry-001
    paths:
      - .github/workflows/module-registry-lock-metadata-repair.yml

permissions:
  contents: write

jobs:
  finalize-browser-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: platform/module-registry-001
          fetch-depth: 0

      - name: Set up accepted Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Regenerate candidate and accept metadata-only browser lock normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import dependency_provenance_implementation as impl

          root = Path.cwd()
          if impl.ACCEPTED_RESOLUTION.get('greenlet') != '3.5.4':
              raise SystemExit('greenlet accepted resolution pin missing')

          with tempfile.TemporaryDirectory(prefix='eod-supply-') as directory:
              work = Path(directory)
              distributions = impl.verified_bootstrap_wheelhouse(work)
              if impl.render_bootstrap(distributions) != (root / 'requirements/bootstrap.txt').read_text(encoding='utf-8'):
                  raise SystemExit('bootstrap root drift; metadata repair aborted')
              generator_python = impl.bootstrap_environment(work)
              candidate_dir = work / 'candidate-locks'
              original = impl.LOCK_DIR
              impl.LOCK_DIR = candidate_dir
              try:
                  impl.generate_locks(generator_python, work)
              finally:
                  impl.LOCK_DIR = original

              byte_mismatches = []
              for profile in impl.LOCK_PROFILES:
                  accepted_path = root / 'requirements/locks' / f'{profile}.txt'
                  candidate_path = candidate_dir / f'{profile}.txt'
                  if impl.parse_lock(accepted_path) != impl.parse_lock(candidate_path):
                      raise SystemExit(f'non-metadata lock drift remains: {profile}')
                  if accepted_path.read_bytes() != candidate_path.read_bytes():
                      byte_mismatches.append(profile)
              if byte_mismatches != ['browser']:
                  raise SystemExit(f'unexpected metadata-only mismatches: {byte_mismatches}')

              accepted_browser = root / 'requirements/locks/browser.txt'
              accepted_browser.write_bytes((candidate_dir / 'browser.txt').read_bytes())
              print('BROWSER_LOCK_METADATA_ONLY_REPAIR=PASS')
          PY

      - name: Remove bounded failure diagnosis and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f docs/work-items/active/MODULE-REGISTRY-001/LOCK_ROOT_REPAIR_FAILURE.json
          git rm -f .github/workflows/module-registry-lock-metadata-repair.yml

      - name: Prove all five locks now regenerate byte for byte
        run: python scripts/regenerate_dependency_locks.py

      - name: Run focused accepted-resolution regression
        run: python tests/process/test_dependency_lock_constraints.py

      - name: Regenerate canonical dependency inventory
        run: python scripts/dependency_provenance_views.py write

      - name: Commit final deterministic lock repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize deterministic browser lock metadata"
          git push origin HEAD:platform/module-registry-001
