name: UX runner escape one-shot transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ux-runner-escape-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'ux/ux-platform-foundation-001' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Apply lint repairs and regenerate final views
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "chore(transport): fix browser runner escape lint"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/browser_theme/run.py")
          source = path.read_text(encoding="utf-8")
          raw_old = '    prepared = editor.evaluate(\n        """editor => {\n'
          raw_new = '    prepared = editor.evaluate(\n        r"""editor => {\n'
          if source.count(raw_old) != 1:
              raise SystemExit(f"unexpected raw-string match count: {source.count(raw_old)}")
          source = source.replace(raw_old, raw_new, 1)
          unused_old = '        reference_picker = need(page, "[data-reference-picker]")\n'
          if source.count(unused_old) != 1:
              raise SystemExit(f"unexpected reference_picker match count: {source.count(unused_old)}")
          source = source.replace(unused_old, '        need(page, "[data-reference-picker]")\n', 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m py_compile tests/browser_theme/run.py
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/dev.txt
          python -m ruff check tests/browser_theme/run.py
          git rm .github/workflows/ux-runner-escape-transport.yml
          python scripts/dependency_provenance_views.py write
          python scripts/dependency_provenance_views.py check
          ! grep -R --fixed-strings "ux-runner-escape-transport.yml" \
              docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY* >/dev/null
      - name: Verify generated files are publication-safe
        shell: bash
        run: |
          set -euo pipefail
          for source in docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY*; do
            python scripts/secret_hygiene.py verify-sanitized --input "$source"
          done
      - name: Atomically publish repair and self-delete transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["EXPECTED_HEAD"]
          branch = os.environ["TARGET_BRANCH"]
          root = Path.cwd()
          transport = ".github/workflows/ux-runner-escape-transport.yml"
          paths = [
              "tests/browser_theme/run.py",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.md",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.01.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.02.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.03.json",
              "docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.entries.04.json",
          ]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "eod-ux-runner-escape/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))
          live = request("GET", f"/git/ref/heads/{branch}")["object"]["sha"]
          if live != expected_head:
              raise SystemExit(f"stale transport head: live={live} expected={expected_head}")
          base_commit = request("GET", f"/git/commits/{expected_head}")
          entries = []
          for relative in paths:
              content = (root / relative).read_bytes()
              blob = request(
                  "POST", "/git/blobs",
                  {"content": base64.b64encode(content).decode("ascii"), "encoding": "base64"},
              )
              entries.append({"path": relative, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          entries.append({"path": transport, "mode": "100644", "type": "blob", "sha": None})
          tree = request("POST", "/git/trees", {"base_tree": base_commit["tree"]["sha"], "tree": entries})
          commit = request(
              "POST", "/git/commits",
              {"message": "test(ux): fix browser runner lint", "tree": tree["sha"], "parents": [expected_head]},
          )
          request("PATCH", f"/git/refs/heads/{branch}", {"sha": commit["sha"], "force": False})
          print(f"FINAL_ESCAPE_HEAD={commit['sha']}")
          PY
