name: EOD Module Registry Gate Repair

on:
  push:
    branches:
      - platform/module-registry-001
    paths:
      - .github/workflows/module-registry-gate-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: platform/module-registry-001
          fetch-depth: 0

      - name: Repair post-SAFE state and fixture baselines
        run: python scripts/_module_registry_gate_repair.py

      - name: Remove one-shot mechanism before generation
        run: |
          git rm scripts/_module_registry_gate_repair.py
          git rm .github/workflows/module-registry-gate-repair.yml

      - name: Regenerate deterministic planning views
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.industrialization_execution import load_raw, render_execution_backlog
          from scripts.release_plan_model import load_program
          from scripts.release_plan_views import render_checklist, render_module_map, render_sequence

          root = Path.cwd()
          plan = json.loads((root / 'docs/project/DEMO_RELEASE_PLAN.yaml').read_text(encoding='utf-8'))
          program = load_program(root)
          (root / 'docs/product/MODULE_MAP.md').write_text(render_module_map(plan), encoding='utf-8')
          (root / 'docs/product/IMPLEMENTATION_SEQUENCE.md').write_text(render_sequence(plan, program), encoding='utf-8')
          (root / 'docs/project/DEMO_RELEASE_MASTER_CHECKLIST.md').write_text(render_checklist(plan, program), encoding='utf-8')
          raw_program, raw_plan = load_raw(root)
          (root / 'docs/project/INDUSTRIALIZATION_EXECUTION_BACKLOG.md').write_text(render_execution_backlog(raw_program, raw_plan), encoding='utf-8')
          PY

      - name: Regenerate canonical dependency inventory
        run: python scripts/dependency_provenance_views.py write

      - name: Commit repair and generated views
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair post-SAFE gates for module registry"
          git push origin HEAD:platform/module-registry-001
