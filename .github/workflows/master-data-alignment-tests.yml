name: TEMP MASTER-DATA-ALIGNMENT-001 tests

on:
  push:
    branches:
      - feature/master-data-alignment-001

permissions:
  contents: write

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: eod_ci
          POSTGRES_USER: eod_ci
          POSTGRES_PASSWORD: eod_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eod_ci -d eod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EOD_DEPLOYMENT_MODE: ci
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_ci
      POSTGRES_USER: eod_ci
      POSTGRES_PASSWORD: eod_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: gate
      EOD_ALLOW_SQLITE_PATH_OVERRIDE: "0"
      TIME_ZONE: Europe/Moscow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/master-data-alignment-001
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
          python -m pip check
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests and publish exact result
        shell: bash
        run: |
          set +e
          python manage.py test apps.imports.tests.test_organization_structure --verbosity 2 > /tmp/focused.log 2>&1
          focused_status=$?
          python manage.py test --verbosity 1 > /tmp/full.log 2>&1
          full_status=$?
          set -e

          mkdir -p .master-data-test-result
          {
            echo "tested_head=$(git rev-parse HEAD)"
            echo "focused_status=${focused_status}"
            echo "full_status=${full_status}"
            echo
            echo "===== FOCUSED TESTS ====="
            cat /tmp/focused.log
            echo
            echo "===== FULL SUITE ====="
            cat /tmp/full.log
          } > .master-data-test-result/result.txt

          rm -f .github/workflows/master-data-alignment-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "TEMP: record MASTER-DATA-ALIGNMENT-001 test result"
          git push origin HEAD:feature/master-data-alignment-001

          test "${focused_status}" -eq 0
          test "${full_status}" -eq 0
