name: Temporary Synchronize Coordinated State With Main

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
    paths:
      - .github/workflows/post-merge-sync-main.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: ${{ github.event.pull_request.number == 58 && github.head_ref == 'supply-chain/dependency-provenance-001' }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Merge current main without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/post-merge-sync-main.yml
          git commit -m "ci: remove temporary post-merge synchronizer"

      - name: Validate synchronized state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/demo_release_plan.py
          python scripts/secret_hygiene.py scan --root .
          python scripts/secret_hygiene.py verify-clean-tree --root .

      - name: Push synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_HEAD_REF}
