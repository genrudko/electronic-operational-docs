name: EOD Development Stack

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eod-development-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-container-smoke:
    name: Isolated development container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: eod_development
      POSTGRES_USER: eod_development
      EOD_DEVELOPMENT_PORT: "8766"
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual_sha"

      - name: Create masked ephemeral development credentials
        shell: bash
        run: |
          set -euo pipefail
          django_value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          postgres_value="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf '::add-mask::%s\n' "$django_value"
          printf '::add-mask::%s\n' "$postgres_value"
          printf 'DJANGO_SECRET_KEY=%s\n' "$django_value" >>"$GITHUB_ENV"
          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_value" >>"$GITHUB_ENV"

      - name: Validate development shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/development_stack.sh
          bash -n scripts/reset_development_database.sh
          sh -n scripts/development-entrypoint.sh

      - name: Validate development Compose configuration
        run: docker compose -f compose.development.yaml config --quiet

      - name: Build development image
        run: docker compose -f compose.development.yaml build --pull

      - name: Start development stack
        run: docker compose -f compose.development.yaml up --detach

      - name: Wait for development application health with verified output
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8766/_health/ >"$RUNNER_TEMP/development-health.raw.json"; then
              python scripts/secret_hygiene.py redact \
                --input "$RUNNER_TEMP/development-health.raw.json" \
                --output "$RUNNER_TEMP/development-health.sanitized.json" \
                --env DJANGO_SECRET_KEY \
                --env POSTGRES_PASSWORD
              python scripts/secret_hygiene.py verify-sanitized \
                --input "$RUNNER_TEMP/development-health.sanitized.json" \
                --env DJANGO_SECRET_KEY \
                --env POSTGRES_PASSWORD
              cat "$RUNNER_TEMP/development-health.sanitized.json"
              exit 0
            fi
            if (( attempt % 10 == 0 )); then
              echo "Health attempt ${attempt}/45"
              docker compose -f compose.development.yaml ps --all
            fi
            sleep 2
          done
          exit 1

      - name: Verify isolated database identity
        run: |
          docker compose -f compose.development.yaml exec -T app \
            python manage.py shell -c \
            'from django.db import connection; assert connection.settings_dict["NAME"] == "eod_development"; assert connection.settings_dict["USER"] == "eod_development"; print("Development database identity: ok")'

      - name: Verify private port exposure
        shell: bash
        run: |
          set -euo pipefail
          app_port="$(docker compose -f compose.development.yaml port app 8766)"
          test "$app_port" = "127.0.0.1:8766"
          if docker compose -f compose.development.yaml port db 5432 \
            >"$RUNNER_TEMP/development-db-port.raw.txt" 2>&1; then
            echo "Development PostgreSQL must not publish a host port."
            exit 1
          fi

      - name: Capture and verify sanitised development diagnostics after failure
        id: diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "===== docker compose ps --all ====="
            docker compose -f compose.development.yaml ps --all
            echo
            echo "===== docker compose logs ====="
            docker compose -f compose.development.yaml logs --no-color
          } >"$RUNNER_TEMP/development-diagnostics.raw.txt" 2>&1
          python scripts/secret_hygiene.py redact \
            --input "$RUNNER_TEMP/development-diagnostics.raw.txt" \
            --output "$RUNNER_TEMP/development-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env POSTGRES_PASSWORD
          python scripts/secret_hygiene.py verify-sanitized \
            --input "$RUNNER_TEMP/development-diagnostics.sanitized.txt" \
            --env DJANGO_SECRET_KEY \
            --env POSTGRES_PASSWORD
          printf 'verified=true\n' >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/development-diagnostics.sanitized.txt"

      - name: Upload verified sanitised development diagnostics after failure
        if: ${{ failure() && steps.diagnostics.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/development-diagnostics.sanitized.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop development stack
        if: ${{ always() }}
        run: docker compose -f compose.development.yaml down --volumes --remove-orphans

      - name: Remove development diagnostic transport files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/development-health.raw.json" \
            "$RUNNER_TEMP/development-health.sanitized.json" \
            "$RUNNER_TEMP/development-db-port.raw.txt" \
            "$RUNNER_TEMP/development-diagnostics.raw.txt" \
            "$RUNNER_TEMP/development-diagnostics.sanitized.txt"

      - name: Verify development checkout remains exactly clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree

  visual-evidence:
    name: Direction A / DEFECT / OPJ visual evidence
    if: contains(github.event.pull_request.labels.*.name, 'vps-development-refresh')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright/python@sha256:678457c4c323b981d8b4befc57b95366bb1bb6aa30057b1269f6b171e8d9975a
      options: --user 0
    services:
      postgres:
        image: postgres@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: eod_browser_ci
          POSTGRES_USER: eod_browser_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U eod_browser_ci -d eod_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_ENGINE: postgresql
      POSTGRES_DB: eod_browser_ci
      POSTGRES_USER: eod_browser_ci
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EOD_DATABASE_PROFILE: presentation
      EOD_BROWSER_BASE_URL: http://127.0.0.1:8766
      EOD_BROWSER_USERNAME: operator.demo
      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'EXACT_HEAD=%s\n' "$actual_sha"

      - name: Configure browser evidence path
        shell: bash
        run: |
          set -euo pipefail
          printf 'EOD_BROWSER_EVIDENCE=%s/browser-theme\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Install locked browser profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/browser.txt
          python -m pip check

      - name: Create masked ephemeral browser credentials
        shell: bash
        run: |
          set -euo pipefail
          django_key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          demo_password="$(python -c 'import secrets; print("Tt1!" + secrets.token_urlsafe(32))')"
          printf '::add-mask::%s\n' "$django_key"
          printf '::add-mask::%s\n' "$demo_password"
          printf 'DJANGO_SECRET_KEY=%s\n' "$django_key" >>"$GITHUB_ENV"
          printf 'EOD_DEMO_USER_PASSWORD=%s\n' "$demo_password" >>"$GITHUB_ENV"
          printf 'EOD_BROWSER_PASSWORD=%s\n' "$demo_password" >>"$GITHUB_ENV"

      - name: Prepare deterministic presentation database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_organization --reset-passwords
          python manage.py seed_demo_equipment
          python manage.py seed_demo_dispatching
          python manage.py seed_demo_normatives
          python manage.py seed_demo_documents
          python manage.py seed_demo_operational_log
          python manage.py seed_equipment_defects

      - name: Run browser visual evidence
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EOD_BROWSER_EVIDENCE"
          python scripts/theme_css_audit.py \
            --ref "$BASE_SHA" \
            --output "$EOD_BROWSER_EVIDENCE/important-before.json"
          baseline="$(python -c 'import json, os; p=os.path.join(os.environ["EOD_BROWSER_EVIDENCE"], "important-before.json"); print(json.load(open(p, encoding="utf-8"))["screen_count"])')"
          python scripts/theme_css_audit.py \
            --max-screen "$baseline" \
            --output "$EOD_BROWSER_EVIDENCE/important-after.json"
          python manage.py runserver 127.0.0.1:8766 --noreload \
            >"$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8766/_health/ >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          python tests/browser_theme/run.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EOD_BROWSER_EVIDENCE"])
          report = json.loads((root / "computed-styles.json").read_text(encoding="utf-8"))
          assert len(report["baseline"]) == 42, report["baseline"].keys()
          required = {
              "defect_filters",
              "defect_datetime",
              "equipment",
              "personnel",
              "workplace",
              "defect_hover",
              "opj_settings",
              "opj_drawer",
              "opj_reference",
              "account_theme",
          }
          assert required <= set(report["open_states"]), report["open_states"].keys()
          assert "print" in report
          screenshots = list((root / "screenshots").glob("*.png"))
          assert len(screenshots) >= 53, len(screenshots)
          PY

      - name: Upload final visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/browser-theme
          if-no-files-found: error
          retention-days: 14

      - name: Verify repository remains clean
        if: ${{ always() }}
        run: python scripts/secret_hygiene.py verify-clean-tree
