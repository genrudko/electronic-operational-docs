name: EOD One-shot Dependency Inventory Sync

on:
  push:
    branches:
      - ux/ux-platform-foundation-001

permissions:
  contents: write

concurrency:
  group: eod-dependency-inventory-sync-once
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'genrudko/electronic-operational-docs' &&
      github.ref == 'refs/heads/ux/ux-platform-foundation-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ux/ux-platform-foundation-001
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Regenerate and commit canonical dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This helper must not exist in the source tree seen by the canonical
          # generator and must not survive its own commit.
          git rm .github/workflows/dependency-inventory-sync-once.yml

          python scripts/dependency_provenance_views.py write
          git diff --check
          git add docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY*

          git diff --cached --name-only | grep -q '^docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY'
          test "$(git diff --cached --name-only | grep -v -E '^(\.github/workflows/dependency-inventory-sync-once\.yml|docs/work-items/active/DEPENDENCY-PROVENANCE-001/DEPENDENCY_BUILD_INVENTORY.*)$' | wc -l)" -eq 0

          git status --short
          git commit -m "UX-PLATFORM Repair v4: sync generated dependency inventory"
          git push origin HEAD:ux/ux-platform-foundation-001
