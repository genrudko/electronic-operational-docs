name: DEFECT-001 Ruff Diagnostic

on:
  push:
    branches:
      - feature/defect-001-equipment-defect-journal

permissions:
  contents: read

concurrency:
  group: defect-001-ruff-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Produce Ruff repair artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"

      - name: Produce repair patch and remaining diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . --fix --exit-zero
          set +e
          python -m ruff check . >ruff-remaining.txt 2>&1
          remaining_status=$?
          set -e
          git diff --binary >ruff-fix.patch
          printf 'remaining_status=%s\n' "$remaining_status" >ruff-summary.txt
          printf 'changed_files=%s\n' "$(git diff --name-only | wc -l)" >>ruff-summary.txt
          cat ruff-summary.txt
          cat ruff-remaining.txt

      - name: Upload Ruff diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: defect-001-ruff-diagnostic-${{ github.sha }}
          path: |
            ruff-fix.patch
            ruff-remaining.txt
            ruff-summary.txt
          if-no-files-found: error
          retention-days: 1
